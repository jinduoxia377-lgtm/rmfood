# RMFOOD local nginx config (for projects working directory)
# This file is used when nginx is started from D:\RMFOODFP

worker_processes  auto;

error_log  D:/RMFOODFP/logs/nginx-error.log warn;
pid        D:/RMFOODFP/logs/nginx.pid;

events {
    worker_connections  4096;
}

http {
    include       C:/tools/nginx-1.31.4/conf/mime.types;
    default_type  application/octet-stream;

    sendfile        on;
    tcp_nopush      on;
    tcp_nodelay     on;
    keepalive_timeout  65;
    types_hash_max_size 2048;

    client_max_body_size 100M;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_types
        text/plain text/css text/xml text/javascript
        application/javascript application/xml application/json
        application/rss+xml image/svg+xml;

    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for"';

    access_log D:/RMFOODFP/logs/nginx-access.log main;

    # ── Upstream Services ──
    upstream vite_frontend {
        server 127.0.0.1:3000;
    }

    upstream backend_api {
        server 127.0.0.1:8000;
    }

    # ── HTTP: Redirect to HTTPS ──
    server {
        listen      80;
        listen       [::]:80;
        server_name  agnet.ltd www.agnet.ltd localhost;

        return 301 https://$host$request_uri;
    }

    # ── HTTPS Server ──
    server {
        listen      443 ssl;
        listen       [::]:443 ssl;
        server_name  agnet.ltd www.agnet.ltd;

        # SSL Certificate (mkcert generated)
        ssl_certificate     D:/RMFOODFP/certs/agnet.ltd.pem;
        ssl_certificate_key D:/RMFOODFP/certs/agnet.ltd-key.pem;

        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
        ssl_prefer_server_ciphers off;
        ssl_session_cache shared:SSL:10m;
        ssl_session_timeout 10m;
        ssl_session_tickets off;

        # Security headers
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

        client_max_body_size 100M;

        proxy_connect_timeout 60s;
        proxy_send_timeout    120s;
        proxy_read_timeout    120s;

        access_log D:/RMFOODFP/logs/agnet.ltd-access.log main;
        error_log  D:/RMFOODFP/logs/agnet.ltd-error.log warn;

        # Frontend (Vite)
        location / {
            proxy_pass http://vite_frontend;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_buffering off;
        }

        # 🔒 P1: 静态资源长期缓存（Vite hash 文件名保证内容变更时 hash 变化）
        location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot|webp|avif)$ {
            proxy_pass http://vite_frontend;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            # 缓存 1 年（文件名含 hash，内容变化时 hash 随之变化）
            expires 1y;
            add_header Cache-Control "public, immutable";
            access_log off;
            # 不缓存 HTML（确保 SPA 路由和 index.html 始终获取最新版本）
        }

        location ~ \.html$ {
            proxy_pass http://vite_frontend;
            add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        }

        # Backend API
        location /api/ {
            proxy_pass http://backend_api;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-Host $host;
            proxy_set_header X-Forwarded-Port $server_port;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_buffering off;
            proxy_request_buffering off;
        }

        # WebSocket
        location /ws {
            proxy_pass http://backend_api;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Swagger
        location /docs {
            proxy_pass http://backend_api;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Health check
        location /health {
            proxy_pass http://backend_api/health;
            access_log off;
        }

        error_page  500 502 503 504 /50x.html;
        location = /50x.html {
            root html;
        }
    }
}
