version: '3.8'

services:
  neo4j:
    image: neo4j:5-community
    container_name: rmfood-neo4j
    restart: unless-stopped
    ports:
      - "7474:7474"   # HTTP 接口
      - "7687:7687"   # Bolt 协议接口
    environment:
      - NEO4J_AUTH=neo4j/Rmfood2024Secure!
      - NEO4J_PLUGINS='["apoc"]'
      - NEO4J_dbms_memory_heap_initial__size=512m
      - NEO4J_dbms_memory_heap_max__size=1G
      - NEO4J_dbms_memory_pagecache_size=256m
    volumes:
      - neo4j_data:/data
      - neo4j_logs:/logs
      - neo4j_import:/var/lib/neo4j/import
      - neo4j_plugins:/plugins
    networks:
      - rmfood-network
    healthcheck:
      test: ["CMD", "cypher-shell", "-u", "neo4j", "-p", "Rmfood2024Secure!", "RETURN 1;"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 40s

volumes:
  neo4j_data:
    driver: local
  neo4j_logs:
    driver: local
  neo4j_import:
    driver: local
  neo4j_plugins:
    driver: local

networks:
  rmfood-network:
    driver: bridge
