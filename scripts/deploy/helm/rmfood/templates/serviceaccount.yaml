{{- if .Values.serviceAccount.create -}}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "rmfood.serviceAccountName" . }}
  namespace: {{ .Release.Namespace }}
  labels: {{ include "rmfood.labels" . | nindent 4 }}
  {{- with .Values.serviceAccount.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
automountServiceAccountToken: true
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "rmfood.fullname" . }}-role
  namespace: {{ .Release.Namespace }}
  labels: {{ include "rmfood.labels" . | nindent 4 }}
rules:
  - apiGroups: [""]
    resources: ["configmaps", "secrets"]
    verbs: ["get", "list"]
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "rmfood.fullname" . }}-rolebinding
  namespace: {{ .Release.Namespace }}
  labels: {{ include "rmfood.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ include "rmfood.fullname" . }}-role
subjects:
  - kind: ServiceAccount
    name: {{ include "rmfood.serviceAccountName" . }}
    namespace: {{ .Release.Namespace }}
{{- end }}
