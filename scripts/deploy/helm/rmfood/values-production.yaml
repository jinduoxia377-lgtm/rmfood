# 生产环境配置覆盖

global:
  environment: production
  imageRegistry: "registry.rmfood.com"

backend:
  replicaCount: 5
  strategy:
    type: RollingUpdate
    maxSurge: 1
    maxUnavailable: 0
  autoscaling:
    enabled: true
    minReplicas: 3
    maxReplicas: 15
    targetCPUUtilizationPercentage: 70
    targetMemoryUtilizationPercentage: 80
  resources:
    requests:
      cpu: "2"
      memory: "4Gi"
    limits:
      cpu: "4"
      memory: "8Gi"
  livenessProbe:
    initialDelaySeconds: 30
    periodSeconds: 10
    timeoutSeconds: 5
    failureThreshold: 3
  readinessProbe:
    initialDelaySeconds: 10
    periodSeconds: 5
    timeoutSeconds: 3
    failureThreshold: 3
  env:
    DEBUG: "false"
    DATABASE_POOL_SIZE: "30"
    DATABASE_MAX_OVERFLOW: "15"
    LOG_LEVEL: "INFO"

frontend:
  replicaCount: 3
  strategy:
    type: RollingUpdate
    maxSurge: 1
    maxUnavailable: 0
  autoscaling:
    enabled: true
    minReplicas: 3
    maxReplicas: 10
    targetCPUUtilizationPercentage: 60
  resources:
    requests:
      cpu: "500m"
      memory: "512Mi"
    limits:
      cpu: "1"
      memory: "1Gi"

postgresql:
  image:
    tag: "15-alpine"
  persistence:
    size: 100Gi
    storageClass: "fast-ssd"
  resources:
    requests:
      cpu: "2"
      memory: "4Gi"
    limits:
      cpu: "4"
      memory: "8Gi"
  env:
    POSTGRES_USER: "rmfood"
    POSTGRES_DB: "rmfood"

pgbouncer:
  enabled: true
  replicaCount: 2
  poolMode: transaction
  maxClientConn: 500
  defaultPoolSize: 50
  resources:
    requests:
      cpu: "500m"
      memory: "512Mi"
    limits:
      cpu: "1"
      memory: "1Gi"

redis:
  image:
    tag: "7-alpine"
  persistence:
    size: 20Gi
    storageClass: "fast-ssd"
  resources:
    requests:
      cpu: "1"
      memory: "2Gi"
    limits:
      cpu: "2"
      memory: "4Gi"

neo4j:
  enabled: true
  image:
    tag: "5.15-community"
  persistence:
    size: 50Gi
  memory: "4g"
  resources:
    requests:
      cpu: "1"
      memory: "4Gi"
    limits:
      cpu: "2"
      memory: "8Gi"

ingress:
  enabled: true
  className: "nginx"
  host: "api.rmfood.com"
  frontendHost: "app.rmfood.com"
  tls:
    enabled: true
    secretName: "rmfood-tls"
  annotations:
    cert-manager.io/cluster-issuer: "letsencrypt-prod"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "3600"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "3600"

serviceAccount:
  create: true
  annotations:
    eks.amazonaws.com/role-arn: "arn:aws:iam::ACCOUNT:role/rmfood-sa"

networkPolicy:
  enabled: true

podDisruptionBudget:
  enabled: true
  minAvailable: 1

monitoring:
  enabled: true
  serviceMonitor:
    enabled: true
    interval: "30s"
    path: "/metrics"

argocd:
  enabled: true
  project: "rmfood"
  syncPolicy:
    automated: true
    prune: true
    selfHeal: true
