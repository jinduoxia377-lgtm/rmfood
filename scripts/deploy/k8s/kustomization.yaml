# RMFOOD K8s 快速部署（Kustomize）
# 生产环境推荐使用 Helm Chart（详见 ../helm/）

apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: rmfood

resources:
  - namespace.yaml
  - backend-deployment.yaml
  - backend-service.yaml
  - backend-hpa.yaml
  - frontend-deployment.yaml
  - frontend-service.yaml
  - frontend-hpa.yaml
  - postgres-statefulset.yaml
  - postgres-service.yaml
  - redis-deployment.yaml
  - redis-service.yaml
  - ingress.yaml

secretGenerator:
  - name: rmfood-secrets
    envs:
      - .env.secret

configMapGenerator:
  - name: rmfood-config
    literals:
      - DEBUG=false
      - DATABASE_POOL_SIZE=20
      - DATABASE_MAX_OVERFLOW=10
