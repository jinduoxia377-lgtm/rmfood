apiVersion: apps/v1
kind: Deployment
metadata:
  name: rmfood-backend
  namespace: rmfood
  labels:
    app: rmfood-backend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: rmfood-backend
  template:
    metadata:
      labels:
        app: rmfood-backend
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8000"
        prometheus.io/path: "/metrics/prometheus"
    spec:
      containers:
        - name: backend
          image: rmfood-backend:latest
          ports:
            - containerPort: 8000
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: rmfood-secrets
                  key: database-url
            - name: SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: rmfood-secrets
                  key: secret-key
            - name: REDIS_URL
              value: "redis://rmfood-redis:6379/0"
            - name: DEBUG
              value: "false"
          resources:
            requests:
              cpu: "500m"
              memory: "512Mi"
            limits:
              cpu: "2000m"
              memory: "2Gi"
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 15
            periodSeconds: 30
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 10
