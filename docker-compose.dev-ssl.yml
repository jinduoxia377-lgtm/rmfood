# RMFOOD 本地开发 SSL 模式
# 使用本机 Vite dev server (port 3000) + 本机 Backend (port 8000)
# Nginx 提供 HTTPS (端口 443) 反向代理到 agnet.ltd
#
# 启动方式:
#   cd D:\RMFOODFP
#   docker compose -f docker-compose.dev-ssl.yml up -d
#
# 访问地址:
#   https://agnet.ltd (前端)
#   https://agnet.ltd/api/v1 (后端 API)
#   https://agnet.ltd/docs (Swagger UI)

version: '3.8'

services:
  # ─── Nginx SSL 反向代理 ───
  nginx:
    image: nginx:1.25-alpine
    container_name: rmfood_nginx_ssl
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./docker/nginx/nginx-ssl-agnet.conf:/etc/nginx/conf.d/ssl-agnet.conf:ro
      - ./certs:/etc/nginx/certs:ro
      - ./logs:/var/log/nginx
    networks:
      - host  # 直接使用宿主机网络，可访问 localhost:3000 和 :8000
    restart: unless-stopped

networks:
  host:
    external: true
