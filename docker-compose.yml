# ════════════════════════════════════════════
#  RMFOOD 配方平台 - 企业级 Docker Compose
#  SSS 级功能完整版
#  包含: 后端 + 前端 + PostgreSQL + Redis + Nginx
# ════════════════════════════════════════════

version: '3.8'

services:
  # ============================================================
  # 🐍 后端 API 服务 (FastAPI)
  # ============================================================
  backend:
    build:
      context: ./backend
      dockerfile: ../Dockerfile.backend
    container_name: rmfood-backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      # 数据库连接 (PostgreSQL)
      - DATABASE_URL=postgresql+asyncpg://${POSTGRES_USER:-rmfood}:${POSTGRES_PASSWORD:-rmfood_secret}@postgres:5432/${POSTGRES_DB:-rmfood}

      # Redis缓存
      - REDIS_URL=redis://redis:6379/0

      # 安全配置 (生产环境必须设置 SECRET_KEY 和 ADMIN_PASSWORD)
      - SECRET_KEY=${SECRET_KEY:?SECRET_KEY must be set in .env}
      - ADMIN_PASSWORD=${ADMIN_PASSWORD:?ADMIN_PASSWORD must be set in .env}
      - DEBUG=false

      # CORS
      - CORS_ORIGINS=${CORS_ORIGINS:-https://rmfood.example.com,http://localhost:3000}

      # JWT配置
      - JWT_ALGORITHM=HS256
      - ACCESS_TOKEN_EXPIRE_MINUTES=30
      - REFRESH_TOKEN_EXPIRE_DAYS=7

      # AI服务配置
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - OPENAI_BASE_URL=${OPENAI_BASE_URL:-https://api.openai.com/v1}
    
    volumes:
      - backend-data:/app/data
      - uploads-data:/app/uploads
      # DEV ONLY: Remove this bind mount in production (code is baked into Docker image)
      - ./backend:/app
    
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    
    networks:
      - rmfood-network
    
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
    
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 2G
        reservations:
          cpus: '0.5'
          memory: 512M

  # ============================================================
  # ⚛️ PostgreSQL 数据库
  # ============================================================
  postgres:
    image: postgres:16-alpine
    container_name: rmfood-postgres
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-rmfood}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set in .env}
      POSTGRES_DB: ${POSTGRES_DB:-rmfood}
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./init-db.sql:/docker-entrypoint-initdb.d/init-db.sql:ro
    networks:
      - rmfood-network
    
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rmfood -d rmfood"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 1G

  # ============================================================
  # 🔁 PgBouncer — PostgreSQL 连接池（M1.5 读写分离）
  # ============================================================
  pgbouncer:
    image: edoburu/pgbouncer:1.23
    container_name: rmfood-pgbouncer
    restart: unless-stopped
    ports:
      - "6432:5432"
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USER: ${POSTGRES_USER:-rmfood}
      DB_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set in .env}
      DB_NAME: ${POSTGRES_DB:-rmfood}
      AUTH_TYPE: scram-sha-256
      POOL_MODE: transaction        # 事务级池化
      DEFAULT_POOL_SIZE: 25         # 默认池大小
      MAX_CLIENT_CONN: 100          # 最大客户端连接
      RESERVE_POOL_SIZE: 5          # 保留连接数（高峰负载）
      RESERVE_POOL_TIMEOUT: 3       # 保留连接超时（秒）
      SERVER_RESET_QUERY: "DISCARD ALL"
    networks:
      - rmfood-network
    depends_on:
      postgres:
        condition: service_healthy

  # ============================================================
  # 🗄️ PostgreSQL 只读副本（M1.5 读写分离，可选）
  # ============================================================
  postgres-replica:
    image: postgres:16-alpine
    container_name: rmfood-postgres-replica
    restart: unless-stopped
    profiles: [ "production" ]  # 仅生产环境启用
    ports:
      - "5433:5432"
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-rmfood}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set in .env}
      POSTGRES_DB: ${POSTGRES_DB:-rmfood}
      PGDATA: /var/lib/postgresql/data/pgdata
      PRIMARY_HOST: postgres                     # 主库地址
      REPLICATION_SLOT: replica_slot
    volumes:
      - postgres-replica-data:/var/lib/postgresql/data
    networks:
      - rmfood-network
    depends_on:
      postgres:
        condition: service_healthy
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 1G

  # ============================================================
  # ⚡ Redis 缓存服务
  # ============================================================
  redis:
    image: redis:7-alpine
    container_name: rmfood-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    command: >
      redis-server 
      --maxmemory 256mb 
      --maxmemory-policy allkeys-lru 
      --appendonly yes 
      --appendfsync everysec
    volumes:
      - redis-data:/data
    networks:
      - rmfood-network
    
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 5s
    
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 512M

  # ============================================================
  # 🎨 前端服务 (React + Vite → Nginx)
  # ============================================================
  frontend:
    build:
      context: ./frontend
      dockerfile: ../Dockerfile.frontend
      args:
        - VITE_API_URL=http://localhost:8000/api/v1
        - VITE_WS_URL=ws://localhost:8000/ws
    container_name: rmfood-frontend
    restart: unless-stopped
    ports:
      - "3000:80"
    environment:
      - NODE_ENV=production
    depends_on:
      - backend
    networks:
      - rmfood-network
    
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:80/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 512M

  # ============================================================
  # 🌐 Nginx 反向代理 (生产入口)
  # ============================================================
  nginx:
    image: nginx:alpine
    container_name: rmfood-nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./ssl:/etc/nginx/ssl:ro
      - nginx-logs:/var/log/nginx
    depends_on:
      - backend
      - frontend
    networks:
      - rmfood-network
    
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 128M

networks:
  rmfood-network:
    driver: bridge
    ipam:
      config:
        - subnet: 172.28.0.0/16

volumes:
  backend-data:
    driver: local
  postgres-data:
    driver: local
  redis-data:
    driver: local
  uploads-data:
    driver: local
  postgres-replica-data:
    driver: local
  nginx-logs:
    driver: local
