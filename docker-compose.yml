# RMFOOD 配方平台 - Docker 部署配置
# 服务: PostgreSQL + Backend + Frontend + Nginx + 监控栈

version: '3.8'

services:
  # ─── 数据库 ───
  postgres:
    image: postgres:16-alpine
    container_name: rmfood_postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      POSTGRES_DB: rmfood
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d rmfood"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - rmfood-net
    restart: unless-stopped

  # ─── 后端 API ───
  backend:
    image: rmfood-backend:latest
    container_name: rmfood_backend
    environment:
      DATABASE_URL: postgresql+asyncpg://postgres:password@postgres:5432/rmfood
      ENV: development
      DEBUG: "True"
      PORT: "8000"
      CORS_ORIGINS: '["http://localhost:3000","http://127.0.0.1:3000","http://localhost:80"]'
      SECRET_KEY: rmfood-dev-secret-key-min-32-chars-for-testing
      ADMIN_PASSWORD: rmfood2024!@#
      REDIS_URL: redis://redis:6379/0
    ports:
      - "8000:8000"
    volumes:
      - uploads_data:/app/uploads
      - ./backend/app:/app/app  # 代码热更新（开发模式）
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "/usr/local/bin/healthcheck.py"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    networks:
      - rmfood-net
    restart: unless-stopped

  # ─── 前端 (Nginx + Vite 构建产物) ───
  frontend:
    image: rmfood-frontend:latest
    container_name: rmfood_frontend
    ports:
      - "3000:80"
    environment:
      VITE_API_BASE_URL: /api
    depends_on:
      - backend
    networks:
      - rmfood-net
    restart: unless-stopped

  # ─── Nginx 反向代理 (统一入口) ───
  nginx:
    image: nginx:1.25-alpine
    container_name: rmfood_nginx
    ports:
      - "80:80"
    volumes:
      - ./docker/nginx/nginx-lan.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - backend
      - frontend
    networks:
      - rmfood-net
    restart: unless-stopped

  # ─── Redis (缓存/队列) ───
  redis:
    image: redis:7-alpine
    container_name: rmfood_redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    networks:
      - rmfood-net
    restart: unless-stopped

  # ─── Prometheus ───
  prometheus:
    image: prom/prometheus:v2.51.0
    container_name: rmfood_prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./docker/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.console.libraries=/usr/share/prometheus/console_libraries'
      - '--web.console.templates=/usr/share/prometheus/consoles'
    networks:
      - rmfood-net
    restart: unless-stopped

  # ─── Grafana ───
  grafana:
    image: grafana/grafana:10.3.3
    container_name: rmfood_grafana
    ports:
      - "3001:3000"
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin123
      GF_INSTALL_PLUGINS: grafana-clock-panel
    volumes:
      - ./docker/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./docker/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana_data:/var/lib/grafana
    depends_on:
      - prometheus
    networks:
      - rmfood-net
    restart: unless-stopped

volumes:
  postgres_data:
    driver: local
  uploads_data:
    driver: local
  redis_data:
    driver: local
  prometheus_data:
    driver: local
  grafana_data:
    driver: local

networks:
  rmfood-net:
    driver: bridge
