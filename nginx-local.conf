# RMFOOD 本地开发 - SSL 反向代理配置 (agnet.ltd)
# nginx 安装目录: C:\tools\nginx-1.31.4\
# 启动方式: nginx.exe -c C:/tools/nginx-1.31.4/conf/rmfood.conf
# 重载配置: nginx.exe -s reload
# 停止服务: nginx.exe -s stop

worker_processes  auto;

error_log  D:/RMFOODFP/logs/nginx-error.log warn;
pid        D:/RMFOODFP/logs/nginx.pid;

events {
    worker_connections  4096;
}

http {
    include       C:/tools/nginx-1.31.4/conf/mime.types;
    default_type  application/octet-stream;

    sendfile        on;
    tcp_nopush      on;
    tcp_nodelay     on;
    keepalive_timeout  65;
    types_hash_max_size 2048;

    # 客户端上传大小限制
    client_max_body_size 100M;

    # Gzip 压缩
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_types
        text/plain
        text/css
        text/xml
        text/javascript
        application/javascript
        application/xml
        application/json
        application/rss+xml
        image/svg+xml;

    # ── 日志格式 ──
    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for"';

    access_log D:/RMFOODFP/logs/nginx-access.log main;

    # ── 上游服务定义（本机服务）──
    upstream vite_frontend {
        server 127.0.0.1:3000;
    }

    upstream backend_api {
        server 127.0.0.1:8000;
    }

    # ── HTTP Server: 仅 agnet.ltd 重定向到 HTTPS，localhost 直接代理 ──
    server {
        listen      80 default_server;
        listen       [::]:80 default_server;
        server_name  localhost 127.0.0.1;

        # localhost 直接代理到前端
        location / {
            proxy_pass http://vite_frontend;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_buffering off;
        }
        location /api/ {
            proxy_pass http://backend_api;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_buffering off;
        }
    }

    # agnet.ltd HTTP → HTTPS 重定向
    server {
        listen      80;
        listen       [::]:80;
        server_name  agnet.ltd www.agnet.ltd;

        return 301 https://$host$request_uri;
    }

    # ── HTTPS Server: agnet.ltd ──
    server {
        listen      443 ssl;
        listen       [::]:443 ssl;
        server_name  agnet.ltd www.agnet.ltd;

        # ── SSL 证书（mkcert 生成的本地信任证书）──
        ssl_certificate     D:/RMFOODFP/certs/agnet.ltd.pem;
        ssl_certificate_key D:/RMFOODFP/certs/agnet.ltd-key.pem;

        # SSL 协议（仅 TLS 1.2+）
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
        ssl_prefer_server_ciphers off;
        ssl_session_cache shared:SSL:10m;
        ssl_session_timeout 10m;
        ssl_session_tickets off;

        # ── 安全响应头 ──
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

        # ── 临时文件目录 ──
        client_body_temp_path D:/RMFOODFP/temp/client_body_temp;
        proxy_temp_path       D:/RMFOODFP/temp/proxy_temp;
        fastcgi_temp_path     D:/RMFOODFP/temp/fastcgi_temp;
        uwsgi_temp_path       D:/RMFOODFP/temp/uwsgi_temp;
        scgi_temp_path        D:/RMFOODFP/temp/scgi_temp;

        # ── 超时设置 ──
        proxy_connect_timeout 60s;
        proxy_send_timeout    120s;
        proxy_read_timeout    120s;

        access_log D:/RMFOODFP/logs/agnet.ltd-access.log main;
        error_log  D:/RMFOODFP/logs/nginx-error.log warn;

        # ══════════════════════════════════════════
        # 前端 SPA (Vite Dev Server)
        # ══════════════════════════════════════════
        location / {
            proxy_pass http://vite_frontend;
            proxy_http_version 1.1;
            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # Vite HMR WebSocket 支持
            proxy_set_header Upgrade           $http_upgrade;
            proxy_set_header Connection        "upgrade";
            proxy_buffering                    off;
        }

        # HTML 不缓存
        location ~ \.html$ {
            proxy_pass http://vite_frontend;
            add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        }

        # ══════════════════════════════════════════
        # 后端 API 代理
        # ══════════════════════════════════════════
        location /api/ {
            proxy_pass http://backend_api;
            proxy_http_version 1.1;
            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-Host  $host;
            proxy_set_header X-Forwarded-Port  $server_port;

            # WebSocket 支持
            proxy_set_header Upgrade           $http_upgrade;
            proxy_set_header Connection        "upgrade";

            # 流式传输（AI 实时生成）
            proxy_buffering                    off;
            proxy_request_buffering            off;
        }

        # ══════════════════════════════════════════
        # WebSocket 端点
        # ══════════════════════════════════════════
        location /ws {
            proxy_pass http://backend_api;
            proxy_http_version 1.1;
            proxy_set_header Host              $host;
            proxy_set_header Upgrade           $http_upgrade;
            proxy_set_header Connection        "upgrade";
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # ══════════════════════════════════════════
        # 后端 Swagger UI
        # ══════════════════════════════════════════
        location /docs {
            proxy_pass http://backend_api;
            proxy_set_header Host              $host;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
        location /redoc {
            proxy_pass http://backend_api;
            proxy_set_header Host              $host;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # ══════════════════════════════════════════
        # 健康检查
        # ══════════════════════════════════════════
        location /health {
            proxy_pass http://backend_api/health;
            access_log off;
        }

        # ══════════════════════════════════════════
        # 错误页面
        # ══════════════════════════════════════════
        error_page  404              /404.html;
        error_page  500 502 503 504 /50x.html;
        location = /50x.html {
            root html;
        }
    }
}
