# ============================================================
# RMFOOD Alembic Database Migration Configuration
#
# Usage:
#   Development (PostgreSQL):
#     alembic revision --autogenerate -m "description"
#     alembic upgrade head
#
#   Production (PostgreSQL):
#     DATABASE_URL=postgresql+asyncpg://user:pass@host:5432/db \
#     alembic upgrade head
#
# Notes:
#   - Do not manually modify [alembic] section
#   - Migration scripts are in alembic/versions/
#   - Generate new migration after each model change
# ============================================================

[alembic]
script_location = alembic

file_template = %%(year)d%%(month).2d%%(day).2d_%%(hour).2d%%(minute).2d%%(second).2d_%%(slug)s

truncate_slug_length = 40

# sqlalchemy.url = dynamically read from app.core.config

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
