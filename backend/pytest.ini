[pytest]
testpaths = app/tests, tests
python_files = test_*.py
python_functions = test_*
python_classes = Test*
asyncio_mode = auto
addopts =
    --strict-markers
    -v
    --tb=short
    --cov=app
    --cov-report=term-missing
    --cov-report=xml:tests-reports/coverage.xml
    --cov-report=html:tests-reports/htmlcov
markers =
    slow: marks tests as slow (deselect with '-m "not slow"')
    integration: marks tests as integration tests
    unit: marks tests as unit tests
    e2e: marks tests as end-to-end tests
    smoke: marks tests as smoke tests
filterwarnings =
    ignore::DeprecationWarning
    ignore::PendingDeprecationWarning

[coverage:run]
source = app
omit =
    */tests/*
    */migrations/*
    */__pycache__/*
    */site-packages/*
    # 注：AI 模块不再排除，需逐步覆盖
    # 以下路径暂时保留（生成器/训练脚本/算法原型）：
    */ai/models/trainer.py
    */ai/models/training_pipeline.py
    */ai/models/formula_discriminator_gan.py
    */ai/models/feedback_system.py

[coverage:report]
exclude_lines =
    pragma: no cover
    def __repr__
    raise AssertionError
    raise NotImplementedError
    if __name__ == .__main__.:
    if TYPE_CHECKING:
    @abstractmethod
show_missing = True
skip_covered = False
fail_under = 75

[coverage:html]
directory = htmlcov
