[project]
name = "rmfood-backend"
version = "2.0.0"
description = "RMFOOD配方设计平台后端"
requires-python = ">=3.12"
authors = [{name = "RMFOOD Team", email = "dev@rmfood.com"}]
license = {text = "MIT"}

# 🔒 P1-2 修复: 使用精确版本号，确保构建可复现
# 核心依赖（FastAPI + ORM + 认证）
dependencies = [
    "fastapi==0.115.0",
    "uvicorn[standard]==0.30.0",
    "sqlalchemy[asyncio]==2.0.35",
    "aiosqlite==0.20.0",
    "asyncpg==0.29.0",        # PostgreSQL 异步驱动
    "alembic==1.13.2",          # 数据库迁移工具（已锁定版本）
    "pydantic==2.9.0",
    "pydantic-settings==2.5.0",
    "python-jose[cryptography]==3.3.0",
    "passlib[bcrypt]==1.7.4",    # passlib + bcrypt 统一密码哈希
    "bcrypt==4.2.0",
    "python-multipart==0.0.9",
    "httpx==0.27.2",

    # 文档导出
    "python-docx==1.1.2",
    "reportlab==4.2.5",
    "openpyxl==3.1.5",

    # 安全工具
    "pip-audit==2.7.3",
    "bandit==1.7.10",

    # 科学计算（协同作用引擎）
    "numpy==2.0.0",
    "scipy==1.14.0",
    "jsonschema==4.23.0",

    # RAG 检索增强生成
    "chromadb==0.5.0",

    # 可观测性
    "opentelemetry-api==1.28.0",
    "opentelemetry-sdk==1.28.0",
]

[project.optional-dependencies]
ml = [
    "torch==2.4.0",
    "rdkit-pypi==2023.9.6",
    "transformers==4.44.0",
]

[tool.uv]
dev-dependencies = [
    "pytest==8.3.0",
    "pytest-asyncio==0.24.0",
    "pytest-cov==5.0.0",     # 🔒 P2-1: 覆盖率报告
    "pytest-timeout==2.3.1",  # 🔒 P2-1: 测试超时控制
    "httpx==0.27.2",
    "ruff==0.6.0",
    "coverage==7.6.0",
    "faker==26.0.0",         # 🔒 P2-1: 测试数据工厂
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W"]
ignore = ["E501"]  # 允许较长行，配合 line-length=100
per-file-ignores = { "__init__.py" = ["F401"] }

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
markers = [
    "unit: 单元测试（快速，无外部依赖）",
    "integration: 集成测试（需要数据库）",
    "e2e: 端到端测试（完整流程）",
    "slow: 慢速测试（可跳过）",
    "security: 安全测试（JWT/注入/CSRF 等）",
    "auth: 认证授权相关测试",
]
filterwarnings = [
    "ignore::DeprecationWarning",
    "ignore::pytest.PytestUnraisableExceptionWarning",
]
# 🔒 P2-1: 增强测试隔离 - 每次测试使用独立数据库
addopts = "--tb=short -v --strict-markers"
# 🔒 P2-1: 测试超时（避免挂起）
timeout = 60

[tool.coverage.run]
source = ["app"]
omit = [
    "app/services/data_sources/*",
    "app/__init__.py",
    "*/migrations/*",
    "*/tests/*",
]
# 🔒 P2-1: 强制覆盖率阈值
branch = true

[tool.coverage.report]
fail_under = 70  # 🔒 低于 70% 覆盖率则 CI 失败
show_missing = true
precision = 2
skip_covered = false
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
    "@abstractmethod",
    "@asynccontextmanager",
]
# 🔒 P2-1: 按模块设置不同阈值
partial_branch = false

[tool.coverage.html]
directory = "htmlcov"
