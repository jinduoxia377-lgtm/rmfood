[project]
name = "rmfood-backend"
version = "2.1.0"
description = "RMFOOD配方设计平台后端"
requires-python = ">=3.12"
authors = [{name = "RMFOOD Team", email = "dev@rmfood.com"}]
license = {text = "MIT"}

# 🔒 P1-2 修复: 使用精确版本号，确保构建可复现
# 核心依赖现在通过分组的requirements文件管理
# 请查看requirements/目录了解依赖分组

dependencies = []  # 依赖现在通过requirements文件管理

[tool.uv]
dev-dependencies = [
    "pytest==8.3.0",
    "pytest-asyncio==0.24.0",
    "pytest-cov==5.0.0",     # 🔒 P2-1: 覆盖率报告
    "pytest-timeout==2.3.1",  # 🔒 P2-1: 测试超时控制
    "httpx==0.27.2",
    "ruff==0.6.0",
    "coverage==7.6.0",
    "faker==26.0.0",         # 🔒 P2-1: 测试数据工厂
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W"]
ignore = ["E501"]  # 允许较长行，配合 line-length=100
# 文档化公开 API 命名跳过（有意保留，改动会破坏 API 契约）：
#   N815 Pydantic camelCase 序列化键（isFollowUp/nutriScore/sessionId/overallScore 等）
#   N803 公开参数名（RotatingFileHandler maxBytes/backupCount、arrhenius Ea/T_celsius、ML X）
#   N818 公开异常（AIException/PermissionDenied/ResourceNotFoundException 等）
#   N802 startTimer（logger __all__）
extend-ignore = ["N815", "N803", "N818", "N802"]
per-file-ignores = { "__init__.py" = ["F401"] }

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
markers = [
    "unit: 单元测试（快速，无外部依赖）",
    "integration: 集成测试（需要数据库）",
    "e2e: 端到端测试（完整流程）",
    "slow: 慢速测试（可跳过）",
    "security: 安全测试（JWT/注入/CSRF 等）",
    "auth: 认证授权相关测试",
]
filterwarnings = [
    "ignore::DeprecationWarning",
    "ignore::pytest.PytestUnraisableExceptionWarning",
]
# 🔒 P2-1: 增强测试隔离 - 每次测试使用独立数据库
addopts = "--tb=short -v --strict-markers"
# 🔒 P2-1: 测试超时（避免挂起）
timeout = 60

[tool.coverage.run]
source = ["app"]
omit = [
    "app/services/data_sources/*",
    "app/__init__.py",
    "*/migrations/*",
    "*/tests/*",
]
# 🔒 P2-1: 强制覆盖率阈值
branch = true

[tool.coverage.report]
# 2026-10-22 统一：与 pytest.ini [coverage:report] fail_under=75 保持一致。
# 注意：CI 实际门槛由 workflow 的 --cov-fail-under 显式控制（当前 0，计划阶梯提升 40→75），
# 此处值仅在本机未显式传 --cov-fail-under 时生效。
fail_under = 75
show_missing = true
precision = 2
skip_covered = false
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise NotImplementedError",
    "if __name__ == \"__main__\":",
    "if TYPE_CHECKING:",
    "@abstractmethod",
    "@asynccontextmanager",
]
# 🔒 P2-1: 按模块设置不同阈值
partial_branch = false

[tool.coverage.html]
directory = "htmlcov"
