# RMFOOD Local Dev - SSL Reverse Proxy for agnet.ltd
# Uses mkcert self-signed certificates for local HTTPS testing

# ── Upstream Definitions ──
upstream frontend_vite {
    server 127.0.0.1:3000;
}

upstream backend_api {
    server 127.0.0.1:8000;
}

# ── HTTP Server: Redirect to HTTPS ──
server {
    listen 80;
    listen [::]:80;
    server_name agnet.ltd www.agnet.ltd localhost;

    # Redirect all HTTP to HTTPS
    return 301 https://$host$request_uri;
}

# ── HTTPS Server ──
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name agnet.ltd www.agnet.ltd;

    # ── SSL Certificates (mkcert generated, trusted locally) ──
    ssl_certificate     /etc/nginx/certs/agnet.ltd.pem;
    ssl_certificate_key /etc/nginx/certs/agnet.ltd-key.pem;

    # SSL Protocol (TLS 1.2+ only)
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;
    ssl_session_tickets off;

    # ── Security Headers ──
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # ── Body & Timeout ──
    client_max_body_size 100M;
    proxy_connect_timeout 60s;
    proxy_send_timeout 60s;
    proxy_read_timeout 120s;

    # ── Logging ──
    access_log /var/log/nginx/agnet.ltd-access.log;
    error_log  /var/log/nginx/agnet.ltd-error.log warn;

    # ─────────────────────────────────────
    # Frontend: SPA (Vite dev server)
    # ─────────────────────────────────────
    location / {
        proxy_pass http://frontend_vite;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Vite HMR WebSocket support
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_buffering off;
    }

    # ─────────────────────────────────────
    # Backend API Proxy
    # ─────────────────────────────────────
    location /api/ {
        proxy_pass http://backend_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port $server_port;

        # WebSocket support
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        # Stream JSON responses (no buffering for AI streaming)
        proxy_buffering off;
        proxy_request_buffering off;
    }

    # ─────────────────────────────────────
    # WebSocket endpoint
    # ─────────────────────────────────────
    location /ws {
        proxy_pass http://backend_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ─────────────────────────────────────
    # Backend docs (Swagger UI)
    # ─────────────────────────────────────
    location /docs {
        proxy_pass http://backend_api;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    location /redoc {
        proxy_pass http://backend_api;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ─────────────────────────────────────
    # Health Check
    # ─────────────────────────────────────
    location /health {
        proxy_pass http://backend_api/health;
        access_log off;
    }
}
