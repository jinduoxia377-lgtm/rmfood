# RMFOOD 生产级 Docker Compose 配置
# 适用于局域网/云服务器生产部署
# 与开发环境 docker-compose.yml 的区别：资源限制、安全加固、健康检查增强

version: '3.8'

services:
  # ─── 数据库（生产级 Postgres）──────────────────────────────
  postgres:
    image: postgres:16-alpine
    container_name: rmfood_postgres_prod
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-rmfood}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-rmfood}
      # 生产性能调优
      POSTGRES_MAX_CONNECTIONS: "150"
      POSTGRES_SHARED_BUFFERS: "256MB"
      POSTGRES_EFFECTIVE_CACHE_SIZE: "768MB"
      POSTGRES_WORK_MEM: "4MB"
      POSTGRES_MAINTENANCE_WORK_MEM: "64MB"
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-rmfood} -d ${POSTGRES_DB:-rmfood}"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - rmfood-net
    restart: unless-stopped
    # 资源限制
    deploy:
      resources:
        limits:
          memory: 2G
          cpus: '2'
        reservations:
          memory: 512M

  # ─── 后端 API（生产级 FastAPI）────────────────────────────
  backend:
    image: ${REGISTRY:-ghcr.io}/${IMAGE_NAME:-rmfood-backend}:${TAG:-latest}
    container_name: rmfood_backend_prod
    build:
      context: ../
      dockerfile: Dockerfile
      target: production
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-rmfood}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-rmfood}
      REDIS_URL: redis://redis:6379/0
      ENV: production
      DEBUG: "False"
      CORS_ORIGINS: '["${FRONTEND_URL:-http://localhost:3000}"]'
      SECRET_KEY: ${SECRET_KEY}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD}
      # 可观测性
      OTEL_ENABLED: "${OTEL_ENABLED:-false}"
      OTEL_SERVICE_NAME: "rmfood-backend"
      # AI 配置
      LLM_PROVIDER: ${LLM_PROVIDER:-deepseek}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_BASE_URL: ${OPENAI_BASE_URL:-}
    ports:
      - "8000:8000"
    volumes:
      - uploads_data:/app/uploads
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "/usr/local/bin/healthcheck.py"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    networks:
      - rmfood-net
    restart: unless-stopped
    # 资源限制（生产级）
    deploy:
      resources:
        limits:
          memory: 4G
          cpus: '4'
        reservations:
          memory: 1G
          cpus: '1'

  # ─── 前端（Nginx 静态服务）────────────────────────────────
  frontend:
    image: ${REGISTRY:-ghcr.io}/${IMAGE_NAME_FRONTEND:-rmfood-frontend}:${TAG:-latest}
    container_name: rmfood_frontend_prod
    build:
      context: ../frontend
      dockerfile: ../Dockerfile.frontend
    environment:
      VITE_API_BASE_URL: /api/v1
      VITE_WS_URL: ws://localhost:8000/ws
    ports:
      - "3000:80"
    depends_on:
      - backend
    networks:
      - rmfood-net
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: '1'

  # ─── Nginx 反向代理（统一入口）────────────────────────────
  nginx:
    image: nginx:1.25-alpine
    container_name: rmfood_nginx_prod
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./docker/nginx/nginx-lan.conf:/etc/nginx/conf.d/default.conf:ro
      - ./docker/nginx/ssl:/etc/nginx/ssl:ro  # 可选 SSL 证书
    depends_on:
      - backend
      - frontend
    networks:
      - rmfood-net
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: '0.5'

  # ─── Redis（缓存 + 事件总线）───────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: rmfood_redis_prod
    command: redis-server --appendonly yes --maxmemory 512mb --maxmemory-policy allkeys-lru
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 15s
      timeout: 3s
      retries: 5
    networks:
      - rmfood-net
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 1G
          cpus: '1'

  # ─── ChromaDB（向量数据库 · RAG）──────────────────────────
  chromadb:
    image: chromadb/chroma:0.5.0
    container_name: rmfood_chromadb
    ports:
      - "8001:8000"
    volumes:
      - chroma_data:/chroma/chroma
    networks:
      - rmfood-net
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 2G
          cpus: '1'

  # ─── Neo4j（知识图谱 · 可选）──────────────────────────────
  neo4j:
    image: neo4j:5.15-alpine
    container_name: rmfood_neo4j
    environment:
      NEO4J_AUTH: ${NEO4J_USER:-neo4j}/${NEO4J_PASSWORD:-neo4j123}
      NEO4J_apoc_export_file_enabled: "true"
      NEO4J_apoc_import_file_enabled: "true"
      NEO4J_apoc_import_file_use__neo4j__config: "true"
    ports:
      - "7474:7474"
      - "7687:7687"
    volumes:
      - neo4j_data:/data
      - neo4j_logs:/logs
    networks:
      - rmfood-net
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 2G
          cpus: '2'
        reservations:
          memory: 512M

  # ─── Prometheus（指标采集）────────────────────────────────
  prometheus:
    image: prom/prometheus:v2.51.0
    container_name: rmfood_prometheus_prod
    ports:
      - "9090:9090"
    volumes:
      - ./docker/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./docker/prometheus/rules:/etc/prometheus/rules:ro
      - prometheus_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.console.libraries=/usr/share/prometheus/console_libraries'
      - '--web.console.templates=/usr/share/prometheus/consoles'
      - '--web.enable-lifecycle'  # 支持热重载配置
    networks:
      - rmfood-net
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 2G
          cpus: '1'

  # ─── Alertmanager（告警路由）──────────────────────────────
  alertmanager:
    image: prom/alertmanager:v0.26.0
    container_name: rmfood_alertmanager
    ports:
      - "9093:9093"
    volumes:
      - ./docker/alertmanager/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
    command:
      - '--config.file=/etc/alertmanager/alertmanager.yml'
      - '--storage.path=/alertmanager'
    networks:
      - rmfood-net
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: '0.5'

  # ─── Grafana（监控仪表盘）─────────────────────────────────
  grafana:
    image: grafana/grafana:10.3.3
    container_name: rmfood_grafana_prod
    ports:
      - "3001:3000"
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD}
      GF_INSTALL_PLUGINS: grafana-clock-panel
      GF_SERVER_ROOT_URL: "${GRAFANA_ROOT_URL:-http://localhost:3001}"
      GF_AUTH_ANONYMOUS_ENABLED: "false"
    volumes:
      - ./docker/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./docker/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana_data:/var/lib/grafana
    depends_on:
      - prometheus
      - alertmanager
    networks:
      - rmfood-net
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 1G
          cpus: '1'

  # ─── Loki（日志聚合）──────────────────────────────────────
  loki:
    image: grafana/loki:2.9.0
    container_name: rmfood_loki
    ports:
      - "3100:3100"
    volumes:
      - ./docker/loki/loki-config.yml:/etc/loki/local-config.yaml:ro
      - loki_data:/loki
    command: -config.file=/etc/loki/local-config.yaml
    networks:
      - rmfood-net
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 2G
          cpus: '1'

  # ─── Promtail（日志采集 agent）────────────────────────────
  promtail:
    image: grafana/promtail:2.9.0
    container_name: rmfood_promtail
    volumes:
      - ./docker/loki/promtail-config.yml:/etc/promtail/config.yml:ro
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
      - /var/run/docker.sock:/var/run/docker.sock
    command: -config.file=/etc/promtail/config.yml
    networks:
      - rmfood-net
    restart: unless-stopped

  # ─── Tempo（分布式追踪）───────────────────────────────────
  tempo:
    image: grafana/tempo:2.4.1
    container_name: rmfood_tempo
    ports:
      - "3200:3200"
      - "9411:9411"
    volumes:
      - ./docker/tempo/tempo-config.yml:/etc/tempo-config.yml:ro
      - tempo_data:/tmp/tempo
    command: -config.file=/etc/tempo-config.yml
    networks:
      - rmfood-net
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 1G
          cpus: '1'

volumes:
  postgres_data:
    driver: local
  uploads_data:
    driver: local
  redis_data:
    driver: local
  chroma_data:
    driver: local
  neo4j_data:
    driver: local
  neo4j_logs:
    driver: local
  prometheus_data:
    driver: local
  grafana_data:
    driver: local
  loki_data:
    driver: local
  tempo_data:
    driver: local

networks:
  rmfood-net:
    driver: bridge
    name: rmfood-prod-net
