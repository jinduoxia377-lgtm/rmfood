<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>滑块功能诊断</title>
    <style>
        body { font-family: system-ui; padding: 40px; max-width: 800px; margin: 0 auto; }
        .test { margin: 20px 0; padding: 20px; border: 2px solid #ddd; border-radius: 8px; }
        .test h3 { margin-top: 0; }
        .log { background: #1a1a1a; color: #0f0; padding: 15px; font-family: monospace; font-size: 12px; max-height: 300px; overflow-y: auto; border-radius: 8px; }
        input[type="range"] { width: 100%; height: 8px; cursor: pointer; }
        .status { margin-top: 10px; padding: 8px; border-radius: 4px; font-weight: bold; }
        .ok { background: #d4edda; color: #155724; }
        .fail { background: #f8d7da; color: #721c24; }
    </style>
</head>
<body>
    <h1>🧪 滑块功能诊断</h1>
    <p>如果以下滑块能拖动，说明浏览器和基础功能正常。</p>
    
    <div class="test">
        <h3>测试 1: 基础 range input</h3>
        <input type="range" min="0" max="100" value="50" id="t1">
        <div class="status" id="s1">等待操作...</div>
    </div>
    
    <div class="test">
        <h3>测试 2: 带 accent-color</h3>
        <input type="range" min="0" max="100" value="50" id="t2" style="accent-color: blue;">
        <div class="status" id="s2">等待操作...</div>
    </div>
    
    <div class="test">
        <h3>测试 3: 按钮点击</h3>
        <button onclick="btnClick()" style="padding: 10px 20px; font-size: 16px; cursor: pointer;">点击测试</button>
        <div class="status" id="s3">等待操作...</div>
    </div>
    
    <div class="log" id="log">
        <div>[系统] 诊断页面已加载，请开始测试...</div>
    </div>
    
    <script>
        function log(msg) {
            var el = document.getElementById('log');
            var time = new Date().toLocaleTimeString();
            el.innerHTML = '[' + time + '] ' + msg + '<br>' + el.innerHTML;
            console.log('[DIAG] ' + msg);
        }
        
        function setStatus(id, msg, ok) {
            var el = document.getElementById(id);
            el.textContent = msg;
            el.className = 'status ' + (ok ? 'ok' : 'fail');
        }
        
        // 测试 1
        document.getElementById('t1').addEventListener('input', function(e) {
            setStatus('s1', '✓ 响应! 值: ' + e.target.value, true);
            log('测试1 - range input 变化: ' + e.target.value);
        });
        
        // 测试 2
        document.getElementById('t2').addEventListener('input', function(e) {
            setStatus('s2', '✓ 响应! 值: ' + e.target.value, true);
            log('测试2 - accent-color slider 变化: ' + e.target.value);
        });
        
        // 测试 3
        function btnClick() {
            setStatus('s3', '✓ 按钮点击成功!', true);
            log('测试3 - 按钮被点击');
            alert('按钮点击成功!\n\n如果弹窗出现，说明鼠标事件完全正常。\n\n问题在于 React 应用层面。');
        }
        
        log('诊断页面就绪 - 请尝试拖动滑块或点击按钮');
    </script>
</body>
</html>
