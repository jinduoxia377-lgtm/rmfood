<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>滑块功能测试</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { 
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            padding: 40px; 
            background: #fff;
            color: #333;
        }
        h1 { margin-bottom: 30px; }
        .test-section { 
            margin: 20px 0; 
            padding: 20px; 
            border: 2px solid #ddd; 
            border-radius: 8px;
        }
        .test-section h3 { margin-bottom: 15px; }
        .log { 
            background: #1a1a1a; 
            color: #0f0; 
            padding: 15px; 
            font-family: monospace; 
            font-size: 12px;
            max-height: 300px;
            overflow-y: auto;
            border-radius: 8px;
            margin-top: 20px;
        }
        input[type="range"] {
            width: 100%;
            height: 8px;
            cursor: pointer;
        }
        .status { 
            margin-top: 10px; 
            padding: 10px; 
            border-radius: 4px;
            font-weight: bold;
        }
        .status.ok { background: #d4edda; color: #155724; }
        .status.fail { background: #f8d7da; color: #721c24; }
    </style>
</head>
<body>
    <h1>🧪 滑块功能测试页面</h1>
    
    <div class="test-section">
        <h3>测试 1: 基础 range input</h3>
        <input type="range" min="0" max="100" value="50" id="test1">
        <div class="status" id="status1">等待操作...</div>
    </div>
    
    <div class="test-section">
        <h3>测试 2: 带样式的 range input</h3>
        <input type="range" min="0" max="100" value="50" id="test2" style="accent-color: #3b82f6;">
        <div class="status" id="status2">等待操作...</div>
    </div>
    
    <div class="test-section">
        <h3>测试 3: 按钮点击</h3>
        <button onclick="testClick()" style="padding: 10px 20px; font-size: 16px; cursor: pointer;">点击测试</button>
        <div class="status" id="status3">等待操作...</div>
    </div>
    
    <div class="log" id="log">
        <div>[系统] 页面加载完成，请开始测试...</div>
    </div>
    
    <script>
        function log(msg) {
            const logEl = document.getElementById('log');
            const time = new Date().toLocaleTimeString();
            logEl.innerHTML = '[{0}] {1}<br>' + logEl.innerHTML;
            console.log(msg);
        }
        
        function setStatus(id, msg, isOk) {
            const el = document.getElementById(id);
            el.textContent = msg;
            el.className = 'status ' + (isOk ? 'ok' : 'fail');
        }
        
        // 测试 1
        document.getElementById('test1').addEventListener('input', function(e) {
            setStatus('status1', '✅ 滑块响应! 当前值: ' + e.target.value, true);
            log('测试1 - 滑块变化: ' + e.target.value);
        });
        
        // 测试 2
        document.getElementById('test2').addEventListener('input', function(e) {
            setStatus('status2', '✅ 滑块响应! 当前值: ' + e.target.value, true);
            log('测试2 - 滑块变化: ' + e.target.value);
        });
        
        // 测试 3
        function testClick() {
            setStatus('status3', '✅ 按钮点击成功!', true);
            log('测试3 - 按钮被点击');
            alert('按钮点击成功! 如果弹窗出现，说明鼠标事件正常。');
        }
        
        log('测试页面已就绪');
    </script>
</body>
</html>
