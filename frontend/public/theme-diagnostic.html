<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>主题系统诊断</title>
  <style>
    body { font-family: -apple-system, BlinkMacSystemFont, sans-serif; padding: 20px; max-width: 1200px; margin: 0 auto; }
    .section { margin: 20px 0; padding: 15px; border: 1px solid #e5e7eb; border-radius: 8px; }
    .section h2 { margin-top: 0; }
    .pass { color: #16a34a; }
    .fail { color: #dc2626; }
    .warn { color: #ca8a04; }
    pre { background: #f5f5f7; padding: 10px; border-radius: 4px; overflow-x: auto; }
    button { padding: 10px 20px; margin: 5px; border: none; border-radius: 6px; cursor: pointer; font-size: 14px; }
    .btn-primary { background: #34C759; color: white; }
    .btn-secondary { background: #007AFF; color: white; }
    .result { font-family: monospace; font-size: 12px; }
  </style>
</head>
<body>
  <h1>🎨 主题系统诊断工具</h1>
  <p>此页面用于诊断主题系统问题</p>
  
  <div class="section">
    <h2>📊 诊断结果</h2>
    <div id="results"></div>
  </div>
  
  <div class="section">
    <h2>🔧 手动测试</h2>
    <button class="btn-primary" onclick="testLightMode()">测试浅色模式</button>
    <button class="btn-secondary" onclick="testDarkMode()">测试深色模式</button>
    <button onclick="runDiagnostic()">重新诊断</button>
  </div>
  
  <div class="section">
    <h2>📋 技术详情</h2>
    <pre id="details"></pre>
  </div>

  <script>
    function getComputedValues() {
      const root = document.documentElement;
      const style = getComputedStyle(root);
      
      return {
        root: {
          classList: root.classList.toString(),
          'data-theme': root.getAttribute('data-theme'),
          'data-mode': root.getAttribute('data-mode'),
          'color-scheme': root.style.colorScheme,
          'inline-style': root.style.cssText.substring(0, 200)
        },
        variables: {
          '--foreground': style.getPropertyValue('--foreground').trim(),
          '--background': style.getPropertyValue('--background').trim(),
          '--card': style.getPropertyValue('--card').trim(),
          '--border': style.getPropertyValue('--border').trim(),
          '--input': style.getPropertyValue('--input').trim()
        }
      };
    }
    
    function runDiagnostic() {
      const data = getComputedValues();
      const results = document.getElementById('results');
      const details = document.getElementById('details');
      
      let html = '<h3>根元素状态</h3><ul>';
      html += `<li class="${data.root.classList.includes('dark') ? 'pass' : 'warn'}">has .dark class: ${data.root.classList.contains('dark')}</li>`;
      html += `<li>data-theme: ${data.root['data-theme']}</li>`;
      html += `<li>data-mode: ${data.root['data-mode']}</li>`;
      html += `<li>color-scheme: ${data.root['color-scheme']}</li>`;
      html += `<li class="${data.root['inline-style'].length === 0 ? 'pass' : 'fail'}">inline styles: ${data.root['inline-style'].length === 0 ? '无' : '有 (可能影响主题切换)'}</li>`;
      html += '</ul>';
      
      html += '<h3>CSS 变量值</h3><ul>';
      for (const [name, value] of Object.entries(data.variables)) {
        const cls = value ? 'pass' : 'fail';
        html += `<li class="${cls}">${name}: ${value || '未定义'}</li>`;
      }
      html += '</ul>';
      
      results.innerHTML = html;
      details.textContent = JSON.stringify(data, null, 2);
    }
    
    function testLightMode() {
      const root = document.documentElement;
      root.classList.remove('dark');
      root.setAttribute('data-mode', 'light');
      root.style.colorScheme = 'light';
      alert('已切换到浅色模式\n请检查页面颜色是否变化');
      runDiagnostic();
    }
    
    function testDarkMode() {
      const root = document.documentElement;
      root.classList.add('dark');
      root.setAttribute('data-mode', 'dark');
      root.style.colorScheme = 'dark';
      alert('已切换到深色模式\n请检查页面颜色是否变化');
      runDiagnostic();
    }
    
    // 页面加载时运行诊断
    window.addEventListener('DOMContentLoaded', runDiagnostic);
  </script>
</body>
</html>
