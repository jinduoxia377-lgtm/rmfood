<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>ECharts 详细测试</title>
    <script src="https://cdn.jsdelivr.net/npm/echarts@5.4.3/dist/echarts.min.js"></script>
    <style>
        body { font-family: sans-serif; padding: 20px; }
        .chart { width: 600px; height: 400px; border: 1px solid #ccc; margin: 20px 0; }
        .log { background: #f5f5f5; padding: 15px; border-radius: 4px; margin: 10px 0; }
        .log p { margin: 5px 0; }
        .success { color: green; }
        .error { color: red; }
    </style>
</head>
<body>
    <h1>ECharts 详细测试</h1>
    <div class="log" id="log">
        <p>正在检测 echarts 加载状态...</p>
    </div>
    <div id="radar-chart" class="chart"></div>
    <div id="bar-chart" class="chart"></div>
    
    <script>
        const log = (msg, type = '') => {
            const div = document.getElementById('log');
            const p = document.createElement('p');
            p.className = type;
            p.textContent = msg;
            div.appendChild(p);
            console.log(msg);
        };
        
        // 检测echarts
        log('window.echarts 类型: ' + typeof window.echarts);
        log('window.echarts 值: ' + (window.echarts ? '存在' : '不存在'));
        
        if (typeof window.echarts === 'undefined') {
            log('✗ echarts未加载，请检查网络连接或CDN地址', 'error');
        } else {
            log('✓ echarts已加载', 'success');
            
            try {
                // 雷达图
                const radarChart = window.echarts.init(document.getElementById('radar-chart'));
                radarChart.setOption({
                    title: { text: '活性谱雷达图', left: 'center', textStyle: { fontSize: 14 } },
                    tooltip: { trigger: 'item' },
                    radar: {
                        indicator: [
                            { name: 'ACE抑制', max: 1 },
                            { name: '抗氧化', max: 1 },
                            { name: '抗菌', max: 1 },
                            { name: '食品安全', max: 1 }
                        ],
                        shape: 'polygon',
                        splitNumber: 4
                    },
                    series: [{
                        type: 'radar',
                        data: [{
                            value: [0.8, 0.6, 0.5, 0.9],
                            name: '活性谱',
                            areaStyle: { color: 'rgba(59,130,246,0.2)' },
                            lineStyle: { color: '#3b82f6', width: 2 }
                        }]
                    }]
                });
                log('✓ 雷达图初始化成功', 'success');
            } catch (e) {
                log('✗ 雷达图初始化失败: ' + e.message, 'error');
            }
            
            try {
                // 柱状图
                const barChart = window.echarts.init(document.getElementById('bar-chart'));
                barChart.setOption({
                    title: { text: '活性得分柱状图', left: 'center', textStyle: { fontSize: 14 } },
                    tooltip: { trigger: 'axis' },
                    grid: { left: '3%', right: '4%', bottom: '15%', containLabel: true },
                    xAxis: {
                        type: 'category',
                        data: ['ACE抑制', '抗氧化', '抗菌', '食品安全'],
                        axisLabel: { color: '#666' }
                    },
                    yAxis: {
                        type: 'value',
                        max: 1,
                        axisLabel: { formatter: '{value}' },
                        splitLine: { lineStyle: { type: 'dashed' } }
                    },
                    series: [{
                        data: [
                            { value: 0.8, itemStyle: { color: '#3b82f6' } },
                            { value: 0.6, itemStyle: { color: '#22c55e' } },
                            { value: 0.5, itemStyle: { color: '#f59e0b' } },
                            { value: 0.9, itemStyle: { color: '#8b5cf6' } }
                        ],
                        type: 'bar',
                        barWidth: '50%',
                        label: { show: true, position: 'top', formatter: '{c}' }
                    }]
                });
                log('✓ 柱状图初始化成功', 'success');
            } catch (e) {
                log('✗ 柱状图初始化失败: ' + e.message, 'error');
            }
        }
    </script>
</body>
</html>
