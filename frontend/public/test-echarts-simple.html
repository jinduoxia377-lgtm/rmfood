<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>ECharts Test</title>
    <script src="/echarts/echarts.umd.js"></script>
</head>
<body>
    <h1>ECharts 测试</h1>
    <div id="log" style="background:#f5f5f5;padding:10px;margin:10px 0;"></div>
    <div id="chart" style="width:600px;height:400px;border:1px solid #ccc;"></div>
    <script>
        const log = msg => {
            document.getElementById('log').innerHTML += '<p>' + msg + '</p>';
            console.log(msg);
        };
        
        log('window.echarts type: ' + typeof window.echarts);
        log('window.echarts exists: ' + (typeof window.echarts !== 'undefined'));
        
        if (typeof window.echarts !== 'undefined') {
            try {
                const chart = window.echarts.init(document.getElementById('chart'));
                chart.setOption({
                    title: { text: '测试雷达图' },
                    radar: {
                        indicator: [
                            { name: 'ACE抑制', max: 100 },
                            { name: '抗氧化', max: 100 },
                            { name: '抗菌', max: 100 },
                            { name: '食品安全', max: 100 }
                        ]
                    },
                    series: [{
                        type: 'radar',
                        data: [{ value: [80, 60, 70, 90], name: '活性谱' }]
                    }]
                });
                log('✓ 图表初始化成功');
            } catch (e) {
                log('✗ 图表初始化失败: ' + e.message);
            }
        } else {
            log('✗ echarts未加载');
        }
    </script>
</body>
</html>
