name: CI/CD Pipeline

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

env:
  NODE_VERSION: '18'
  PYTHON_VERSION: '3.11'

jobs:
  # 前端 CI
  frontend-ci:
    name: Frontend CI
    runs-on: ubuntu-latest
    
    defaults:
      run:
        working-directory: ./frontend
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npm run typecheck

      - name: Lint check
        run: npm run lint

      - name: Run tests
        run: npm test -- --coverage

      # ── 主题系统静态门禁（G-4：已交付的门禁接入 CI）──
      # theme:validate 校验令牌命名/值格式符合规范 §3.1，纯静态、无服务依赖。
      - name: Theme token validation
        run: npm run theme:validate

      # ui:guard 校验 a11y/内联样式等静态护栏（与 pre-commit 同一实现），
      # 防止本地钩子被跳过时护栏静默失效。
      - name: UI accessibility guard
        run: npm run ui:guard

      - name: Build
        run: npm run build

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: frontend-build
          path: frontend/dist
          retention-days: 7

  # 主题系统渲染级门禁（14 项，含 GATE-04~08 / GATE-15 等需真实渲染的断言）
  # 需启动 Vite dev server 并安装 Chromium；--require-render 使渲染不可用即失败，
  # 避免 CI 上「渲染跑不起来就被 skip」而让门禁形同虚设。
  theme-gate:
    name: Theme Gate (render-level)
    runs-on: ubuntu-latest
    needs: [frontend-ci]

    defaults:
      run:
        working-directory: ./frontend

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Start dev server on :3000
        run: |
          npx vite --host 127.0.0.1 --port 3000 --strictPort > /tmp/vite.log 2>&1 &
          echo $! > /tmp/vite.pid
          for i in $(seq 1 90); do
            if curl -sf http://127.0.0.1:3000/ > /dev/null 2>&1; then
              echo "dev server ready after ${i} polls"
              exit 0
            fi
            sleep 2
          done
          echo "dev server failed to start"
          cat /tmp/vite.log
          exit 1

      - name: Run theme gate (render required)
        run: npm run theme:gate:ci
        env:
          THEME_GATE_USER: admin
          THEME_GATE_PASS: admin123

      - name: Upload theme gate log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: theme-gate-log
          path: |
            frontend/scripts/theme-audit/*.log
            /tmp/vite.log
          if-no-files-found: ignore
          retention-days: 7

  # 后端 CI
  backend-ci:
    name: Backend CI
    runs-on: ubuntu-latest
    
    defaults:
      run:
        working-directory: ./backend
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-asyncio pytest-cov black ruff

      - name: Format check (Black)
        run: black --check .

      - name: Lint check (Ruff)
        run: ruff check .

      - name: Run tests
        run: |
          pytest tests/ \
            --cov=app \
            --cov-report=xml \
            --cov-report=html \
            --cov-fail-under=50

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v4
        if: success()
        with:
          files: ./backend/coverage.xml
          flags: unittests
          name: backend-coverage

  # E2E 测试
  e2e-test:
    name: E2E Tests
    runs-on: ubuntu-latest
    needs: [frontend-ci, backend-ci]
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install Playwright
        run: |
          npx playwright install --with-deps

      - name: Download frontend build
        uses: actions/download-artifact@v4
        with:
          name: frontend-build
          path: frontend/dist

      - name: Start backend server
        run: |
          cd backend
          pip install -r requirements.txt
          uvicorn app.main:app --host 0.0.0.0 --port 8000 &
          sleep 5

      - name: Start frontend server
        run: |
          cd frontend
          npx serve -s dist -l 3000 &
          sleep 3

      - name: Run Playwright tests
        run: |
          npx playwright test

  # Docker 构建和推送
  docker:
    name: Docker Build & Push
    runs-on: ubuntu-latest
    needs: [e2e-test]
    if: github.ref == 'refs/heads/main'
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push backend
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          push: true
          tags: |
            ghcr.io/${{ github.repository }}/backend:latest
            ghcr.io/${{ github.repository }}/backend:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and push frontend
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          push: true
          tags: |
            ghcr.io/${{ github.repository }}/frontend:latest
            ghcr.io/${{ github.repository }}/frontend:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # 安全扫描
  security:
    name: Security Scan
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          scan-ref: '.'
          format: 'sarif'
          output: 'trivy-results.sarif'

      - name: Upload Trivy scan results to GitHub Security
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: 'trivy-results.sarif'

      - name: Run npm audit
        run: |
          cd frontend
          npm audit --audit-level=high

      - name: Run pip-audit
        run: |
          cd backend
          pip install pip-audit
          pip-audit
