<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#059669" />
    <meta name="description" content="莱茵分子是药食同源配方研发平台，融合分子生物学、人工智能与功能性食品科学" />
    <meta name="application-name" content="莱茵分子 配方设计平台" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <title>莱茵分子 - 药食同源配方研发平台</title>
    <!-- 字体使用系统字体回退，避免外部 Google Fonts 网络依赖导致国内加载超时 -->
    <script>
      /* ECharts CDN（可选，仅数据库页的 3D 肽结构视图使用，带优雅降级）：
         加载失败不会阻塞应用，PeptideStructureAnalyzer 已有 window.echarts 缺失守卫 */
      (function () {
        var s = document.createElement('script');
        s.src = 'https://cdn.jsdelivr.net/npm/echarts@5.4.3/dist/echarts.min.js';
        s.async = true;
        s.onload = function () { console.info('[ECharts] CDN ready'); };
        s.onerror = function () { console.warn('[ECharts] CDN 加载失败，肽结构 3D 视图将不可用（不影响其他功能）'); };
        document.head.appendChild(s);
      })();
    </script>
    <script>
      // D-11 修复：原脚本读取 'rmfood-theme-settings-v2'（全项目无写入方，实测恒为 null），
      // 且 mode 取值用 'auto' 而 store 用 'system'，导致预置暗色主题时首屏必然亮色闪烁。
      // 现对齐 themeStore 的 persist 键名与结构（{ state: { mode }, version }）。
      (function () {
        try {
          var raw = localStorage.getItem('rmfood-theme-storage');
          if (!raw) return;
          var parsed = JSON.parse(raw);
          var state = parsed && parsed.state;
          var mode = state && state.mode;
          if (!mode) return;
          var prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
          var isDark = mode === 'dark' || (mode === 'system' && prefersDark);
          if (isDark) document.documentElement.classList.add('dark');
          // 无障碍模式属性也需在首屏前就位，否则刷新后 semantic-utils.css 的规则失效（D-39）
          if (state.accessibilityMode && state.accessibilityMode !== 'normal') {
            document.documentElement.setAttribute('data-a11y-mode', state.accessibilityMode);
            if (state.accessibilityMode === 'reading') {
              document.documentElement.setAttribute('data-reading-mode', isDark ? 'dark-read' : 'sepia');
            }
          }
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
