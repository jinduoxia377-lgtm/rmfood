<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
    <meta http-equiv="Pragma" content="no-cache" />
    <meta http-equiv="Expires" content="0" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#059669" />
    <meta name="description" content="莱茵分子是药食同源配方研发平台，融合分子生物学、人工智能与功能性食品科学" />
    <meta name="application-name" content="莱茵分子 配方设计平台" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <title>莱茵分子 - 药食同源配方研发平台</title>
    <!-- 字体使用系统字体回退，避免外部 Google Fonts 网络依赖导致国内加载超时 -->
    <!--
      ⚡ P3 性能优化：ECharts 已从此处移除（2026-10-27）。
      此前 ~1MB 的 echarts.min.js 在 *每一个* 页面加载（含 AI 助手页），与关键路径 JS bundle
      争抢带宽，直接拉高 FCP / LCP / 页面加载耗时，而它的唯一消费者是数据库页的
      PeptideStructureAnalyzer。现改为由该组件按需注入（同源 /echarts/echarts.min.js，
      仅挂载时才加载，且不再依赖外网 CDN）。
    -->
    <script>
      // D-11 修复：原脚本读取 'rmfood-theme-settings-v2'（全项目无写入方，实测恒为 null），
      // 且 mode 取值用 'auto' 而 store 用 'system'，导致预置暗色主题时首屏必然亮色闪烁。
      // 现对齐 themeStore 的 persist 键名与结构（{ state: { mode }, version }）。
      (function () {
        try {
          var raw = localStorage.getItem('rmfood-theme-storage');
          if (!raw) return;
          var parsed = JSON.parse(raw);
          var state = parsed && parsed.state;
          var mode = state && state.mode;
          if (!mode) return;
          var prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
          var isDark = mode === 'dark' || (mode === 'system' && prefersDark);
          if (isDark) document.documentElement.classList.add('dark');
          // 无障碍模式属性也需在首屏前就位，否则刷新后 semantic-utils.css 的规则失效（D-39）
          if (state.accessibilityMode && state.accessibilityMode !== 'normal') {
            document.documentElement.setAttribute('data-a11y-mode', state.accessibilityMode);
            if (state.accessibilityMode === 'reading') {
              document.documentElement.setAttribute('data-reading-mode', isDark ? 'dark-read' : 'sepia');
            }
          }
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
