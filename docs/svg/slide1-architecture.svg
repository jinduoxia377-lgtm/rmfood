<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" font-family="Microsoft YaHei, sans-serif">
  <defs>
    <linearGradient id="grad1" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#2D5A3D;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#4A7C59;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="grad2" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#667eea;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#764ba2;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="grad3" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#FF6B6B;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#EE5A5A;stop-opacity:1" />
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="2" dy="2" stdDeviation="3" flood-opacity="0.2"/>
    </filter>
  </defs>
  
  <!-- 背景 -->
  <rect width="960" height="540" fill="#f8f9fa"/>
  
  <!-- 标题 -->
  <text x="480" y="40" text-anchor="middle" font-size="24" font-weight="bold" fill="#2D5A3D">RMFOOD 微信小程序系统架构图</text>
  <text x="480" y="65" text-anchor="middle" font-size="14" fill="#666">技术栈：Taro 4.x + React 18 + FastAPI + PostgreSQL</text>
  
  <!-- 前端层 -->
  <rect x="50" y="90" width="200" height="100" rx="10" fill="url(#grad1)" filter="url(#shadow)"/>
  <text x="150" y="120" text-anchor="middle" font-size="16" font-weight="bold" fill="white">📱 前端展示层</text>
  <text x="150" y="145" text-anchor="middle" font-size="12" fill="white">Taro 4.x 框架</text>
  <text x="150" y="165" text-anchor="middle" font-size="12" fill="white">React 18 + TypeScript</text>
  <text x="150" y="180" text-anchor="middle" font-size="11" fill="rgba(255,255,255,0.8)">12个页面 + 18个组件</text>
  
  <!-- 业务逻辑层 -->
  <rect x="300" y="90" width="200" height="100" rx="10" fill="url(#grad1)" filter="url(#shadow)"/>
  <text x="400" y="120" text-anchor="middle" font-size="16" font-weight="bold" fill="white">⚙️ 业务逻辑层</text>
  <text x="400" y="145" text-anchor="middle" font-size="12" fill="white">Zustand 状态管理</text>
  <text x="400" y="165" text-anchor="middle" font-size="12" fill="white">自定义 Hooks</text>
  <text x="400" y="180" text-anchor="middle" font-size="11" fill="rgba(255,255,255,0.8)">缓存管理 + 请求拦截</text>
  
  <!-- 请求层 -->
  <rect x="550" y="90" width="200" height="100" rx="10" fill="url(#grad1)" filter="url(#shadow)"/>
  <text x="650" y="120" text-anchor="middle" font-size="16" font-weight="bold" fill="white">🌐 请求层</text>
  <text x="650" y="145" text-anchor="middle" font-size="12" fill="white">fetch API + wx.request</text>
  <text x="650" y="165" text-anchor="middle" font-size="12" fill="white">SSE流式输出</text>
  <text x="650" y="180" text-anchor="middle" font-size="11" fill="rgba(255,255,255,0.8)">AES加密Token</text>
  
  <!-- 后端层 -->
  <rect x="150" y="230" width="300" height="120" rx="10" fill="url(#grad3)" filter="url(#shadow)"/>
  <text x="300" y="265" text-anchor="middle" font-size="18" font-weight="bold" fill="white">🚀 FastAPI 后端服务</text>
  <text x="300" y="295" text-anchor="middle" font-size="13" fill="white">/api/v1/ai/* - AI智能服务</text>
  <text x="300" y="315" text-anchor="middle" font-size="13" fill="white">/api/v1/formulas/* - 配方服务</text>
  <text x="300" y="335" text-anchor="middle" font-size="13" fill="white">/api/v1/nutrition/* - 营养分析 ⭐</text>
  
  <!-- 数据层 -->
  <rect x="550" y="230" width="300" height="120" rx="10" fill="url(#grad2)" filter="url(#shadow)"/>
  <text x="700" y="265" text-anchor="middle" font-size="18" font-weight="bold" fill="white">💾 数据存储层</text>
  <text x="700" y="295" text-anchor="middle" font-size="13" fill="white">PostgreSQL - 业务数据</text>
  <text x="700" y="315" text-anchor="middle" font-size="13" fill="white">Redis - 缓存/队列</text>
  <text x="700" y="335" text-anchor="middle" font-size="13" fill="white">MinIO - 文件存储</text>
  
  <!-- 箭头 -->
  <path d="M 150 195 L 150 225" stroke="#2D5A3D" stroke-width="3" marker-end="url(#arrowhead)"/>
  <path d="M 400 195 L 400 225" stroke="#2D5A3D" stroke-width="3" marker-end="url(#arrowhead)"/>
  <path d="M 650 195 L 650 225" stroke="#2D5A3D" stroke-width="3" marker-end="url(#arrowhead)"/>
  <path d="M 450 350 L 540 350" stroke="#667eea" stroke-width="3" marker-end="url(#arrowhead2)"/>
  
  <!-- 箭头标记 -->
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
      <polygon points="0 0, 10 3, 0 6" fill="#2D5A3D"/>
    </marker>
    <marker id="arrowhead2" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
      <polygon points="0 0, 10 3, 0 6" fill="#667eea"/>
    </marker>
  </defs>
  
  <!-- 底部说明 -->
  <text x="480" y="400" text-anchor="middle" font-size="12" fill="#999">分包策略：主包(首页+搜索+对比) | chat分包 | formulas分包 | profile分包 | health-check独立分包</text>
  <text x="480" y="425" text-anchor="middle" font-size="12" fill="#999">包体积控制：主包&lt;2MB | 分包预下载优化首屏体验</text>
  
  <!-- 核心能力标注 -->
  <rect x="50" y="450" width="200" height="70" rx="8" fill="#e8f5e9" stroke="#2D5A3D" stroke-width="2"/>
  <text x="150" y="475" text-anchor="middle" font-size="13" font-weight="bold" fill="#2D5A3D">✅ 技术可行</text>
  <text x="150" y="495" text-anchor="middle" font-size="11" fill="#666">后端SSE端点完整</text>
  <text x="150" y="510" text-anchor="middle" font-size="11" fill="#666">前端fetch API消费正确</text>
  
  <rect x="280" y="450" width="200" height="70" rx="8" fill="#fff3e0" stroke="#FF9800" stroke-width="2"/>
  <text x="380" y="475" text-anchor="middle" font-size="13" font-weight="bold" fill="#E65100">✅ 架构合理</text>
  <text x="380" y="495" text-anchor="middle" font-size="11" fill="#666">Taro跨端框架</text>
  <text x="380" y="510" text-anchor="middle" font-size="11" fill="#666">分包加载管理规范</text>
  
  <rect x="510" y="450" width="200" height="70" rx="8" fill="#e3f2fd" stroke="#2196F3" stroke-width="2"/>
  <text x="610" y="475" text-anchor="middle" font-size="13" font-weight="bold" fill="#1565C0">✅ 合规完善</text>
  <text x="610" y="495" text-anchor="middle" font-size="11" fill="#666">隐私政策+免责声明</text>
  <text x="610" y="510" text-anchor="middle" font-size="11" fill="#666">健康数据保护齐全</text>
  
  <rect x="740" y="450" width="170" height="70" rx="8" fill="#fce4ec" stroke="#E91E63" stroke-width="2"/>
  <text x="825" y="475" text-anchor="middle" font-size="13" font-weight="bold" fill="#C2185B">⭐ 核心差异</text>
  <text x="825" y="495" text-anchor="middle" font-size="11" fill="#666">配料表分析功能</text>
  <text x="825" y="510" text-anchor="middle" font-size="11" fill="#666">差异化竞争力</text>
</svg>
