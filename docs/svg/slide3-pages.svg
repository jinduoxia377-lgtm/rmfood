<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" font-family="Microsoft YaHei, sans-serif">
  <defs>
    <linearGradient id="p0" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#2D5A3D;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#4A7C59;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="p1" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#FF9800;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#F57C00;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="p2" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#9E9E9E;stop-opacity:1" />
      <stop offset="100%" style="stop-color#757575;stop-opacity:1" />
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="2" dy="2" stdDeviation="3" flood-opacity="0.2"/>
    </filter>
  </defs>
  
  <!-- 背景 -->
  <rect width="960" height="540" fill="#f8f9fa"/>
  
  <!-- 标题 -->
  <text x="480" y="40" text-anchor="middle" font-size="24" font-weight="bold" fill="#2D5A3D">页面结构图（12个页面）</text>
  
  <!-- 主包页面 -->
  <text x="50" y="80" font-size="14" font-weight="bold" fill="#666">主包页面</text>
  
  <!-- P0页面 -->
  <rect x="40" y="95" width="140" height="70" rx="8" fill="white" stroke="#2D5A3D" stroke-width="2" filter="url(#shadow)"/>
  <rect x="40" y="95" width="140" height="25" rx="8" fill="url(#p0)"/>
  <rect x="40" y="112" width="140" height="8" fill="url(#p0)"/>
  <text x="110" y="135" text-anchor="middle" font-size="13" font-weight="bold" fill="#2D5A3D">🏠 首页</text>
  <text x="110" y="155" text-anchor="middle" font-size="11" fill="#666">index</text>
  
  <rect x="195" y="95" width="140" height="70" rx="8" fill="white" stroke="#2D5A3D" stroke-width="2" filter="url(#shadow)"/>
  <rect x="195" y="95" width="140" height="25" rx="8" fill="url(#p0)"/>
  <rect x="195" y="112" width="140" height="8" fill="url(#p0)"/>
  <text x="265" y="135" text-anchor="middle" font-size="13" font-weight="bold" fill="#2D5A3D">🔍 搜索页</text>
  <text x="265" y="155" text-anchor="middle" font-size="11" fill="#666">search</text>
  
  <rect x="350" y="95" width="140" height="70" rx="8" fill="white" stroke="#2D5A3D" stroke-width="2" filter="url(#shadow)"/>
  <rect x="350" y="95" width="140" height="25" rx="8" fill="url(#p0)"/>
  <rect x="350" y="112" width="140" height="8" fill="url(#p0)"/>
  <text x="420" y="135" text-anchor="middle" font-size="13" font-weight="bold" fill="#2D5A3D">⚖️ 配方对比</text>
  <text x="420" y="155" text-anchor="middle" font-size="11" fill="#666">compare</text>
  
  <rect x="505" y="95" width="140" height="70" rx="8" fill="white" stroke="#2D5A3D" stroke-width="2" filter="url(#shadow)"/>
  <rect x="505" y="95" width="140" height="25" rx="8" fill="url(#p0)"/>
  <rect x="505" y="112" width="140" height="8" fill="url(#p0)"/>
  <text x="575" y="135" text-anchor="middle" font-size="13" font-weight="bold" fill="#2D5A3D">⚙️ 设置页</text>
  <text x="575" y="155" text-anchor="middle" font-size="11" fill="#666">settings</text>
  
  <rect x="660" y="95" width="140" height="70" rx="8" fill="white" stroke="#2D5A3D" stroke-width="2" filter="url(#shadow)"/>
  <rect x="660" y="95" width="140" height="25" rx="8" fill="url(#p0)"/>
  <rect x="660" y="112" width="140" height="8" fill="url(#p0)"/>
  <text x="730" y="135" text-anchor="middle" font-size="13" font-weight="bold" fill="#2D5A3D">📜 隐私政策</text>
  <text x="730" y="155" text-anchor="middle" font-size="11" fill="#666">privacy</text>
  
  <rect x="815" y="95" width="105" height="70" rx="8" fill="white" stroke="#2D5A3D" stroke-width="2" filter="url(#shadow)"/>
  <rect x="815" y="95" width="105" height="25" rx="8" fill="url(#p0)"/>
  <rect x="815" y="112" width="105" height="8" fill="url(#p0)"/>
  <text x="867" y="135" text-anchor="middle" font-size="12" font-weight="bold" fill="#2D5A3D">📝 用户协议</text>
  <text x="867" y="155" text-anchor="middle" font-size="11" fill="#666">agreement</text>
  
  <!-- 分包页面 -->
  <text x="50" y="200" font-size="14" font-weight="bold" fill="#666">分包页面（formulas）</text>
  
  <rect x="40" y="215" width="140" height="70" rx="8" fill="white" stroke="#2D5A3D" stroke-width="2" filter="url(#shadow)"/>
  <rect x="40" y="215" width="140" height="25" rx="8" fill="url(#p0)"/>
  <rect x="40" y="232" width="140" height="8" fill="url(#p0)"/>
  <text x="110" y="255" text-anchor="middle" font-size="13" font-weight="bold" fill="#2D5A3D">💬 AI对话</text>
  <text x="110" y="275" text-anchor="middle" font-size="11" fill="#666">chat/index</text>
  
  <rect x="195" y="215" width="140" height="70" rx="8" fill="white" stroke="#2D5A3D" stroke-width="2" filter="url(#shadow)"/>
  <rect x="195" y="215" width="140" height="25" rx="8" fill="url(#p0)"/>
  <rect x="195" y="232" width="140" height="8" fill="url(#p0)"/>
  <text x="265" y="255" text-anchor="middle" font-size="13" font-weight="bold" fill="#2D5A3D">📋 配方列表</text>
  <text x="265" y="275" text-anchor="middle" font-size="11" fill="#666">formulas/index</text>
  
  <rect x="350" y="215" width="140" height="70" rx="8" fill="white" stroke="#2D5A3D" stroke-width="2" filter="url(#shadow)"/>
  <rect x="350" y="215" width="140" height="25" rx="8" fill="url(#p0)"/>
  <rect x="350" y="232" width="140" height="8" fill="url(#p0)"/>
  <text x="420" y="255" text-anchor="middle" font-size="13" font-weight="bold" fill="#2D5A3D">📄 配方详情</text>
  <text x="420" y="275" text-anchor="middle" font-size="11" fill="#666">formula-detail</text>
  
  <rect x="505" y="215" width="140" height="70" rx="8" fill="white" stroke="#FF6B6B" stroke-width="3" filter="url(#shadow)"/>
  <rect x="505" y="215" width="140" height="25" rx="8" fill="url(#p0)"/>
  <rect x="505" y="232" width="140" height="8" fill="url(#p0)"/>
  <text x="575" y="255" text-anchor="middle" font-size="13" font-weight="bold" fill="#FF6B6B">🔬 配料分析 ⭐</text>
  <text x="575" y="275" text-anchor="middle" font-size="11" fill="#666">ingredient-analysis</text>
  
  <rect x="660" y="215" width="260" height="70" rx="8" fill="white" stroke="#2D5A3D" stroke-width="2" filter="url(#shadow)"/>
  <rect x="660" y="215" width="260" height="25" rx="8" fill="url(#p0)"/>
  <rect x="660" y="232" width="260" height="8" fill="url(#p0)"/>
  <text x="790" y="255" text-anchor="middle" font-size="13" font-weight="bold" fill="#2D5A3D">👤 个人中心</text>
  <text x="790" y="275" text-anchor="middle" font-size="11" fill="#666">profile/index + settings</text>
  
  <!-- 独立分包 -->
  <text x="50" y="320" font-size="14" font-weight="bold" fill="#666">独立分包（health-check）</text>
  
  <rect x="40" y="335" width="200" height="70" rx="8" fill="white" stroke="#FF9800" stroke-width="2" filter="url(#shadow)"/>
  <rect x="40" y="335" width="200" height="25" rx="8" fill="url(#p1)"/>
  <rect x="40" y="352" width="200" height="8" fill="url(#p1)"/>
  <text x="140" y="375" text-anchor="middle" font-size="13" font-weight="bold" fill="#E65100">🧪 体质诊断</text>
  <text x="140" y="395" text-anchor="middle" font-size="11" fill="#666">health-check/index</text>
  
  <!-- 图例 -->
  <text x="50" y="450" font-size="14" font-weight="bold" fill="#666">图例说明</text>
  
  <rect x="50" y="465" width="30" height="20" rx="4" fill="#2D5A3D"/>
  <text x="90" y="480" font-size="12" fill="#333">P0 核心功能（8个页面）</text>
  
  <rect x="280" y="465" width="30" height="20" rx="4" fill="#FF9800"/>
  <text x="320" y="480" font-size="12" fill="#333">P1 增值功能（3个页面）</text>
  
  <rect x="530" y="465" width="30" height="20" rx="4" fill="#9E9E9E"/>
  <text x="570" y="480" font-size="12" fill="#333">P2 扩展功能（1个页面）</text>
  
  <rect x="760" y="465" width="30" height="20" rx="4" fill="white" stroke="#FF6B6B" stroke-width="2"/>
  <text x="800" y="480" font-size="12" fill="#333">⭐ 新增核心功能</text>
</svg>
