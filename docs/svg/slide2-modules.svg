<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" font-family="Microsoft YaHei, sans-serif">
  <defs>
    <linearGradient id="card1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#2D5A3D;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#4A7C59;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="card2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#FF6B6B;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#EE5A5A;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="card3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#FF9800;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#F57C00;stop-opacity:1" />
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="2" dy="2" stdDeviation="3" flood-opacity="0.2"/>
    </filter>
  </defs>
  
  <!-- 背景 -->
  <rect width="960" height="540" fill="#f8f9fa"/>
  
  <!-- 标题 -->
  <text x="480" y="40" text-anchor="middle" font-size="24" font-weight="bold" fill="#2D5A3D">三大核心功能模块</text>
  <text x="480" y="65" text-anchor="middle" font-size="14" fill="#666">AI智能对话 | 配方管理 | 配料表分析（新增核心）</text>
  
  <!-- 模块一：AI智能对话 -->
  <rect x="40" y="100" width="260" height="380" rx="16" fill="white" stroke="#2D5A3D" stroke-width="3" filter="url(#shadow)"/>
  <rect x="40" y="100" width="260" height="60" rx="16" fill="url(#card1)"/>
  <rect x="40" y="140" width="260" height="20" fill="url(#card1)"/>
  <text x="170" y="138" text-anchor="middle" font-size="18" font-weight="bold" fill="white">💬 AI智能对话</text>
  
  <text x="70" y="185" font-size="14" fill="#333">• 流式输出（打字机效果）</text>
  <text x="70" y="215" font-size="14" fill="#333">• 语音输入支持</text>
  <text x="70" y="245" font-size="14" fill="#333">• 快捷问题推荐</text>
  <text x="70" y="275" font-size="14" fill="#333">• 配方卡片内嵌</text>
  <text x="70" y="305" font-size="14" fill="#333">• 对话历史记录</text>
  <text x="70" y="335" font-size="14" fill="#333">• 免责声明展示</text>
  
  <rect x="70" y="370" width="200" height="40" rx="8" fill="#e8f5e9"/>
  <text x="170" y="395" text-anchor="middle" font-size="13" font-weight="bold" fill="#2D5A3D">API: /ai/chat/stream</text>
  
  <rect x="70" y="425" width="200" height="35" rx="8" fill="#f5f5f5"/>
  <text x="170" y="447" text-anchor="middle" font-size="12" fill="#666">优先级：P0 | 周期：第1-2周</text>
  
  <!-- 模块二：配方管理 -->
  <rect x="350" y="100" width="260" height="380" rx="16" fill="white" stroke="#FF9800" stroke-width="3" filter="url(#shadow)"/>
  <rect x="350" y="100" width="260" height="60" rx="16" fill="url(#card3)"/>
  <rect x="350" y="140" width="260" height="20" fill="url(#card3)"/>
  <text x="480" y="138" text-anchor="middle" font-size="18" font-weight="bold" fill="white">📋 配方管理</text>
  
  <text x="380" y="185" font-size="14" fill="#333">• 配方列表浏览</text>
  <text x="380" y="215" font-size="14" fill="#333">• 配方分类筛选</text>
  <text x="380" y="245" font-size="14" fill="#333">• 配方搜索功能</text>
  <text x="380" y="275" font-size="14" fill="#333">• 配方详情展示</text>
  <text x="380" y="305" font-size="14" fill="#333">• 配方收藏管理</text>
  <text x="380" y="335" font-size="14" fill="#333">• 分享海报生成</text>
  
  <rect x="380" y="370" width="200" height="40" rx="8" fill="#fff3e0"/>
  <text x="480" y="395" text-anchor="middle" font-size="13" font-weight="bold" fill="#E65100">API: /formulas/*</text>
  
  <rect x="380" y="425" width="200" height="35" rx="8" fill="#f5f5f5"/>
  <text x="480" y="447" text-anchor="middle" font-size="12" fill="#666">优先级：P0 | 周期：第1-2周</text>
  
  <!-- 模块三：配料表分析（核心） -->
  <rect x="660" y="100" width="260" height="380" rx="16" fill="white" stroke="#FF6B6B" stroke-width="4" filter="url(#shadow)"/>
  <rect x="660" y="100" width="260" height="60" rx="16" fill="url(#card2)"/>
  <rect x="660" y="140" width="260" height="20" fill="url(#card2)"/>
  <text x="790" y="138" text-anchor="middle" font-size="18" font-weight="bold" fill="white">🔬 配料表分析 ⭐</text>
  
  <text x="690" y="185" font-size="14" fill="#333">• 拍照识别配料表</text>
  <text x="690" y="215" font-size="14" fill="#333">• 手动/语音输入</text>
  <text x="690" y="245" font-size="14" fill="#333">• 营养成分计算</text>
  <text x="690" y="275" font-size="14" fill="#333">• 健康价值评估</text>
  <text x="690" y="305" font-size="14" fill="#333">• 安全禁忌审查</text>
  <text x="690" y="335" font-size="14" fill="#333">• 改进建议生成</text>
  
  <rect x="690" y="370" width="200" height="40" rx="8" fill="#ffebee"/>
  <text x="790" y="395" text-anchor="middle" font-size="13" font-weight="bold" fill="#C2185B">API: /nutrition/*</text>
  
  <rect x="690" y="425" width="200" height="35" rx="8" fill="#f5f5f5"/>
  <text x="790" y="447" text-anchor="middle" font-size="12" fill="#666">优先级：P0 | 周期：第1-2周</text>
  
  <!-- 底部统计 -->
  <rect x="40" y="500" width="880" height="30" rx="8" fill="#2D5A3D"/>
  <text x="200" y="520" text-anchor="middle" font-size="13" fill="white">核心功能：29项</text>
  <text x="400" y="520" text-anchor="middle" font-size="13" fill="white">增值功能：18项</text>
  <text x="600" y="520" text-anchor="middle" font-size="13" fill="white">扩展功能：9项</text>
  <text x="800" y="520" text-anchor="middle" font-size="13" fill="white">总计：56项功能</text>
</svg>
