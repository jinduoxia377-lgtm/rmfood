<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" font-family="Microsoft YaHei, sans-serif">
  <defs>
    <linearGradient id="step1" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#2D5A3D;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#4A7C59;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="step2" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#667eea;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#764ba2;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="step3" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#FF6B6B;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#EE5A5A;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="step4" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#FF9800;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#F57C00;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="step5" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#2196F3;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1976D2;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="step6" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#4CAF50;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#388E3C;stop-opacity:1" />
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="2" dy="2" stdDeviation="3" flood-opacity="0.2"/>
    </filter>
  </defs>
  
  <!-- 背景 -->
  <rect width="960" height="540" fill="#f8f9fa"/>
  
  <!-- 标题 -->
  <text x="480" y="40" text-anchor="middle" font-size="24" font-weight="bold" fill="#2D5A3D">数据流向图（配料表分析示例）</text>
  <text x="480" y="65" text-anchor="middle" font-size="14" fill="#666">从用户输入到结果展示的完整流程</text>
  
  <!-- 步骤1：用户输入 -->
  <rect x="50" y="100" width="180" height="100" rx="12" fill="white" stroke="#2D5A3D" stroke-width="2" filter="url(#shadow)"/>
  <circle cx="80" cy="130" r="20" fill="url(#step1)"/>
  <text x="80" y="136" text-anchor="middle" font-size="16" font-weight="bold" fill="white">1</text>
  <text x="140" y="130" font-size="14" font-weight="bold" fill="#2D5A3D">用户输入</text>
  <text x="140" y="155" font-size="12" fill="#666">拍照识别配料表</text>
  <text x="140" y="175" font-size="12" fill="#666">手动/语音输入</text>
  
  <!-- 箭头1 -->
  <path d="M 230 150 L 270 150" stroke="#2D5A3D" stroke-width="2" marker-end="url(#arrow)"/>
  
  <!-- 步骤2：前端解析 -->
  <rect x="280" y="100" width="180" height="100" rx="12" fill="white" stroke="#667eea" stroke-width="2" filter="url(#shadow)"/>
  <circle cx="310" cy="130" r="20" fill="url(#step2)"/>
  <text x="310" y="136" text-anchor="middle" font-size="16" font-weight="bold" fill="white">2</text>
  <text x="350" y="130" font-size="14" font-weight="bold" fill="#667eea">前端解析</text>
  <text x="350" y="155" font-size="12" fill="#666">提取成分名称</text>
  <text x="350" y="175" font-size="12" fill="#666">构建请求参数</text>
  
  <!-- 箭头2 -->
  <path d="M 460 150 L 500 150" stroke="#667eea" stroke-width="2" marker-end="url(#arrow)"/>
  
  <!-- 步骤3：调用API -->
  <rect x="510" y="100" width="180" height="100" rx="12" fill="white" stroke="#FF6B6B" stroke-width="2" filter="url(#shadow)"/>
  <circle cx="540" cy="130" r="20" fill="url(#step3)"/>
  <text x="540" y="136" text-anchor="middle" font-size="16" font-weight="bold" fill="white">3</text>
  <text x="580" y="130" font-size="14" font-weight="bold" fill="#FF6B6B">调用API</text>
  <text x="560" y="155" font-size="11" fill="#666">调用分析接口</text>
  <text x="560" y="175" font-size="11" fill="#666">Bearer认证</text>
  
  <!-- 箭头3 -->
  <path d="M 700 150 L 740 150" stroke="#FF6B6B" stroke-width="2" marker-end="url(#arrow)"/>
  
  <!-- 步骤4：后端处理 -->
  <rect x="750" y="100" width="160" height="100" rx="12" fill="white" stroke="#FF9800" stroke-width="2" filter="url(#shadow)"/>
  <circle cx="780" cy="130" r="20" fill="url(#step4)"/>
  <text x="780" y="136" text-anchor="middle" font-size="16" font-weight="bold" fill="white">4</text>
  <text x="820" y="130" font-size="13" font-weight="bold" fill="#FF9800">后端处理</text>
  <text x="770" y="155" font-size="11" fill="#666">营养计算</text>
  <text x="770" y="175" font-size="11" fill="#666">安全审查</text>
  
  <!-- 箭头向下 -->
  <path d="M 830 200 L 830 240" stroke="#FF9800" stroke-width="2" marker-end="url(#arrow)"/>
  
  <!-- 步骤5：返回结果 -->
  <rect x="510" y="250" width="180" height="100" rx="12" fill="white" stroke="#2196F3" stroke-width="2" filter="url(#shadow)"/>
  <circle cx="540" cy="280" r="20" fill="url(#step5)"/>
  <text x="540" y="286" text-anchor="middle" font-size="16" font-weight="bold" fill="white">5</text>
  <text x="580" y="280" font-size="14" font-weight="bold" fill="#2196F3">返回结果</text>
  <text x="580" y="305" font-size="12" fill="#666">营养标签JSON</text>
  <text x="580" y="325" font-size="12" fill="#666">健康评分+建议</text>
  
  <!-- 箭头向左 -->
  <path d="M 510 300 L 470 300" stroke="#2196F3" stroke-width="2" marker-end="url(#arrow)"/>
  
  <!-- 步骤6：前端展示 -->
  <rect x="50" y="250" width="360" height="100" rx="12" fill="white" stroke="#4CAF50" stroke-width="2" filter="url(#shadow)"/>
  <circle cx="80" cy="280" r="20" fill="url(#step6)"/>
  <text x="80" y="286" text-anchor="middle" font-size="16" font-weight="bold" fill="white">6</text>
  <text x="120" y="280" font-size="14" font-weight="bold" fill="#4CAF50">前端展示</text>
  <text x="120" y="305" font-size="12" fill="#666">• NutritionLabel组件</text>
  <text x="120" y="325" font-size="12" fill="#666">• HealthScore组件</text>
  <text x="120" y="345" font-size="12" fill="#666">• ImprovementSuggestion组件</text>
  
  <!-- 后端处理详情 -->
  <rect x="750" y="250" width="160" height="120" rx="12" fill="#f5f5f5" stroke="#FF9800" stroke-width="1"/>
  <text x="830" y="275" text-anchor="middle" font-size="12" font-weight="bold" fill="#FF9800">后端服务模块</text>
  <text x="770" y="300" font-size="11" fill="#666">• NutritionLabelGenerator</text>
  <text x="770" y="320" font-size="11" fill="#666">• SafetyChecker</text>
  <text x="770" y="340" font-size="11" fill="#666">• HealthEvaluator</text>
  <text x="770" y="360" font-size="11" fill="#666">• nutrition_database.py</text>
  
  <!-- 底部说明 -->
  <rect x="50" y="390" width="860" height="130" rx="12" fill="white" stroke="#e0e0e0" stroke-width="1"/>
  <text x="480" y="420" text-anchor="middle" font-size="16" font-weight="bold" fill="#2D5A3D">技术要点</text>
  
  <text x="100" y="450" font-size="12" fill="#333">🔐 <tspan font-weight="bold">安全认证：</tspan>AES加密Token，自动刷新，401跳转登录</text>
  <text x="100" y="475" font-size="12" fill="#333">⚡ <tspan font-weight="bold">流式输出：</tspan>fetch API + ReadableStream，打字机效果</text>
  <text x="500" y="450" font-size="12" fill="#333">📊 <tspan font-weight="bold">GB 28050标准：</tspan>国家营养标签格式，能量校验</text>
  <text x="500" y="475" font-size="12" fill="#333">💾 <tspan font-weight="bold">本地缓存：</tspan>HistoryStorage，弱网可用</text>
  
  <!-- 箭头标记 -->
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
      <polygon points="0 0, 10 3, 0 6" fill="#666"/>
    </marker>
  </defs>
</svg>
