version: '3.8'

services:
  devcontainer:
    build:
      context: .
      dockerfile: Dockerfile
    volumes:
      - ..:/workspace:cached
    command: sleep infinity
    networks:
      - dev-network

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: rmfood
      POSTGRES_PASSWORD: rmfood_dev
      POSTGRES_DB: rmfood
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks:
      - dev-network

  redis:
    image: redis:7-alpine
    networks:
      - dev-network

networks:
  dev-network:
    driver: bridge

volumes:
  postgres-data:
