# RMFOOD Helm Chart 配置 (v2.0.0 — 院士级架构升级 Phase 3)

global:
  environment: production
  imageRegistry: docker.io/rmfood

# ─── 服务账号 ───
serviceAccount:
  create: true
  name: ""
  annotations: {}
  # iam.gke.io/gcp-service-account: "rmfood@project.iam.gserviceaccount.com"

# ─── 网络策略 ───
networkPolicy:
  enabled: true

# ─── PodDisruptionBudget ───
podDisruptionBudget:
  enabled: true
  backend:
    minAvailable: 1
  frontend:
    minAvailable: 1

# ─── 后端服务 ───
backend:
  replicaCount: 3
  image:
    repository: rmfood-backend
    tag: latest
    pullPolicy: Always
  service:
    port: 8000
    targetPort: 8000
  resources:
    requests:
      cpu: "500m"
      memory: "512Mi"
    limits:
      cpu: "2"
      memory: "2Gi"
  autoscaling:
    enabled: true
    minReplicas: 2
    maxReplicas: 10
    targetCPUUtilizationPercentage: 70
    targetMemoryUtilizationPercentage: 80
  env:
    - name: DEBUG
      value: "false"
    - name: DATABASE_POOL_SIZE
      value: "20"
    - name: DATABASE_MAX_OVERFLOW
      value: "10"
  # 健康检查调优
  livenessProbe:
    httpGet:
      path: /health
      port: 8000
    initialDelaySeconds: 15
    periodSeconds: 20
    timeoutSeconds: 5
    failureThreshold: 3
  readinessProbe:
    httpGet:
      path: /health
      port: 8000
    initialDelaySeconds: 10
    periodSeconds: 10
    timeoutSeconds: 3
    failureThreshold: 3
  # 滚动更新策略
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  # 优雅关闭
  terminationGracePeriodSeconds: 60

# ─── 前端服务 ───
frontend:
  replicaCount: 2
  image:
    repository: rmfood-frontend
    tag: latest
    pullPolicy: Always
  service:
    port: 80
    targetPort: 80
  resources:
    requests:
      cpu: "200m"
      memory: "256Mi"
    limits:
      cpu: "1"
      memory: "512Mi"
  autoscaling:
    enabled: true
    minReplicas: 2
    maxReplicas: 5
    targetCPUUtilizationPercentage: 70
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  terminationGracePeriodSeconds: 30

# ─── PostgreSQL ───
postgresql:
  enabled: true
  image: postgres:16-alpine
  resources:
    requests:
      cpu: "500m"
      memory: "1Gi"
    limits:
      cpu: "1"
      memory: "2Gi"
  persistence:
    enabled: true
    size: 20Gi
    storageClassName: ""
  env:
    POSTGRES_DB: rmfood
    POSTGRES_USER: rmfood
    POSTGRES_PASSWORD: ""  # 由 Secret 注入

# ─── Redis ───
redis:
  enabled: true
  image: redis:7-alpine
  password: ""  # 由 Secret 注入
  resources:
    requests:
      cpu: "200m"
      memory: "256Mi"
    limits:
      cpu: "500m"
      memory: "512Mi"
  persistence:
    enabled: true
    size: 5Gi
    storageClassName: ""

# ─── PgBouncer (连接池) ───
pgbouncer:
  enabled: true
  image: edoburu/pgbouncer:1.23
  poolMode: transaction
  defaultPoolSize: 25
  maxClientConn: 100
  reservePoolSize: 5
  resources:
    requests:
      cpu: "100m"
      memory: "64Mi"
    limits:
      cpu: "500m"
      memory: "256Mi"

# ─── Neo4j (知识图谱，可选) ───
neo4j:
  enabled: false
  image: neo4j:5-community
  resources:
    requests:
      cpu: "500m"
      memory: "1Gi"
    limits:
      cpu: "1"
      memory: "2Gi"
  persistence:
    enabled: true
    size: 10Gi

# ─── Ingress ───
ingress:
  enabled: true
  className: nginx
  host: api.rmfood.com
  frontendHost: app.rmfood.com
  tls:
    enabled: true
    secretName: rmfood-tls
    clusterIssuer: letsencrypt-prod
  # WebSocket 专用注解
  annotations:
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    nginx.ingress.kubernetes.io/proxy-body-size: "50m"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "3600"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "3600"
    cert-manager.io/cluster-issuer: "letsencrypt-prod"

# ─── 配置 ───
config:
  jwtAlgorithm: HS256
  accessTokenExpireMinutes: 30
  refreshTokenExpireDays: 7
  openaiApiKey: ""

# ─── 密钥（必填） ───
secretKey: ""
adminPassword: ""

# ─── 监控 ───
monitoring:
  enabled: true
  prometheusScrape: true
  # ServiceMonitor (Prometheus Operator)
  serviceMonitor:
    enabled: false
    interval: 15s
    path: /metrics/prometheus

# ─── ArgoCD GitOps ───
argocd:
  enabled: false
  project: default
  repoURL: ""
  targetRevision: main
