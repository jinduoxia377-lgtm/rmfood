{{- if .Values.networkPolicy.enabled -}}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "rmfood.fullname" . }}-netpol
  namespace: {{ .Release.Namespace }}
  labels: {{ include "rmfood.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: {{ include "rmfood.name" . }}
  policyTypes:
    - Ingress
    - Egress
  ingress:
    # 允许 Ingress Controller 访问
    - from:
        - namespaceSelector:
            matchLabels:
              name: ingress-nginx
      ports:
        - port: 8000
          protocol: TCP
        - port: 80
          protocol: TCP
    # 允许同 namespace 内服务互访
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: {{ include "rmfood.name" . }}
    # 允许 Prometheus 抓取指标
    - from:
        - namespaceSelector:
            matchLabels:
              name: monitoring
      ports:
        - port: 8000
          protocol: TCP
  egress:
    # 允许 DNS 解析
    - to: []
      ports:
        - port: 53
          protocol: UDP
        - port: 53
          protocol: TCP
    # 允许访问 PostgreSQL
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/component: database
      ports:
        - port: 5432
          protocol: TCP
    # 允许访问 Redis
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/component: cache
      ports:
        - port: 6379
          protocol: TCP
    # 允许访问外部 LLM API (HTTPS)
    - to: []
      ports:
        - port: 443
          protocol: TCP
{{- end }}
