{{- if and .Values.pgbouncer.enabled .Values.postgresql.enabled -}}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "rmfood.fullname" . }}-pgbouncer
  namespace: {{ .Release.Namespace }}
  labels: {{ include "rmfood.labels" . | nindent 4 }}
    app.kubernetes.io/component: pgbouncer
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ include "rmfood.name" . }}
      app.kubernetes.io/component: pgbouncer
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ include "rmfood.name" . }}
        app.kubernetes.io/component: pgbouncer
    spec:
      containers:
        - name: pgbouncer
          image: "{{ .Values.pgbouncer.image }}"
          ports:
            - containerPort: 5432
              name: pgbouncer
          env:
            - name: DB_HOST
              value: "{{ include "rmfood.fullname" . }}-postgres"
            - name: DB_PORT
              value: "5432"
            - name: DB_USER
              value: {{ .Values.postgresql.env.POSTGRES_USER | quote }}
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "rmfood.fullname" . }}-secrets
                  key: POSTGRES_PASSWORD
            - name: DB_NAME
              value: {{ .Values.postgresql.env.POSTGRES_DB | quote }}
            - name: AUTH_TYPE
              value: scram-sha-256
            - name: POOL_MODE
              value: {{ .Values.pgbouncer.poolMode | quote }}
            - name: DEFAULT_POOL_SIZE
              value: {{ .Values.pgbouncer.defaultPoolSize | quote }}
            - name: MAX_CLIENT_CONN
              value: {{ .Values.pgbouncer.maxClientConn | quote }}
            - name: RESERVE_POOL_SIZE
              value: {{ .Values.pgbouncer.reservePoolSize | quote }}
            - name: SERVER_RESET_QUERY
              value: "DISCARD ALL"
          livenessProbe:
            tcpSocket:
              port: 5432
            initialDelaySeconds: 5
            periodSeconds: 10
          readinessProbe:
            tcpSocket:
              port: 5432
            initialDelaySeconds: 3
            periodSeconds: 5
          resources: {{ toYaml .Values.pgbouncer.resources | nindent 12 }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "rmfood.fullname" . }}-pgbouncer
  namespace: {{ .Release.Namespace }}
  labels: {{ include "rmfood.labels" . | nindent 4 }}
    app.kubernetes.io/component: pgbouncer
spec:
  type: ClusterIP
  ports:
    - port: 5432
      targetPort: 5432
      name: pgbouncer
  selector:
    app.kubernetes.io/name: {{ include "rmfood.name" . }}
    app.kubernetes.io/component: pgbouncer
{{- end }}
