{{- if .Values.neo4j.enabled -}}
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ include "rmfood.fullname" . }}-neo4j
  namespace: {{ .Release.Namespace }}
  labels: {{ include "rmfood.labels" . | nindent 4 }}
    app.kubernetes.io/component: graphdb
spec:
  serviceName: {{ include "rmfood.fullname" . }}-neo4j-headless
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ include "rmfood.name" . }}
      app.kubernetes.io/component: graphdb
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ include "rmfood.name" . }}
        app.kubernetes.io/component: graphdb
    spec:
      containers:
        - name: neo4j
          image: "{{ .Values.neo4j.image }}"
          ports:
            - containerPort: 7474
              name: http
            - containerPort: 7687
              name: bolt
          env:
            - name: NEO4J_AUTH
              value: "neo4j/$(NEO4J_PASSWORD)"
            - name: NEO4J_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "rmfood.fullname" . }}-secrets
                  key: NEO4J_PASSWORD
            - name: NEO4J_PLUGINS
              value: '["apoc"]'
            - name: NEO4J_dbms_memory_heap_initial__size
              value: "512m"
            - name: NEO4J_dbms_memory_heap_max__size
              value: "1G"
            - name: NEO4J_dbms_memory_pagecache_size
              value: "256m"
          livenessProbe:
            exec:
              command: ["cypher-shell", "-u", "neo4j", "-p", "$(NEO4J_PASSWORD)", "RETURN 1;"]
            initialDelaySeconds: 40
            periodSeconds: 30
            timeoutSeconds: 10
          readinessProbe:
            exec:
              command: ["cypher-shell", "-u", "neo4j", "-p", "$(NEO4J_PASSWORD)", "RETURN 1;"]
            initialDelaySeconds: 20
            periodSeconds: 10
          resources: {{ toYaml .Values.neo4j.resources | nindent 12 }}
          volumeMounts:
            - name: data
              mountPath: /data
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: {{ .Values.neo4j.persistence.size }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "rmfood.fullname" . }}-neo4j
  namespace: {{ .Release.Namespace }}
  labels: {{ include "rmfood.labels" . | nindent 4 }}
    app.kubernetes.io/component: graphdb
spec:
  type: ClusterIP
  ports:
    - port: 7474
      targetPort: 7474
      name: http
    - port: 7687
      targetPort: 7687
      name: bolt
  selector:
    app.kubernetes.io/name: {{ include "rmfood.name" . }}
    app.kubernetes.io/component: graphdb
{{- end }}
