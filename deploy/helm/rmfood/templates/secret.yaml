apiVersion: v1
kind: Secret
metadata:
  name: {{ include "rmfood.fullname" . }}-secrets
  labels: {{ include "rmfood.labels" . | nindent 4 }}
type: Opaque
stringData:
  SECRET_KEY: {{ required "SECRET_KEY is required" .Values.secretKey | quote }}
  ADMIN_PASSWORD: {{ required "ADMIN_PASSWORD is required" .Values.adminPassword | quote }}
  POSTGRES_PASSWORD: {{ .Values.postgresql.env.POSTGRES_PASSWORD | default (randAlphaNum 24) | quote }}
  POSTGRES_REPLICA_PASSWORD: {{ .Values.postgresql.replicaPassword | default (randAlphaNum 24) | quote }}
  REDIS_PASSWORD: {{ .Values.redis.password | default "" | quote }}
  OPENAI_API_KEY: {{ .Values.config.openaiApiKey | default "" | quote }}
  NEO4J_PASSWORD: {{ .Values.neo4j.password | default (randAlphaNum 16) | quote }}
  PGBOUNCER_PASSWORD: {{ .Values.pgbouncer.authUserPassword | default (randAlphaNum 16) | quote }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "rmfood.fullname" . }}-config
  labels: {{ include "rmfood.labels" . | nindent 4 }}
data:
  APP_NAME: "RMFOOD配方设计平台"
  APP_VERSION: {{ .Chart.AppVersion | quote }}
  DEBUG: {{ .Values.backend.env.DEBUG | quote }}
  DATABASE_URL: "postgresql+asyncpg://{{ .Values.postgresql.env.POSTGRES_USER }}:$(POSTGRES_PASSWORD)@{{ include "rmfood.fullname" . }}-postgres:5432/{{ .Values.postgresql.env.POSTGRES_DB }}"
  REDIS_URL: "redis://:$(REDIS_PASSWORD)@{{ include "rmfood.fullname" . }}-redis:6379/0"
  JWT_ALGORITHM: {{ .Values.config.jwtAlgorithm | quote }}
  ACCESS_TOKEN_EXPIRE_MINUTES: {{ .Values.config.accessTokenExpireMinutes | quote }}
  REFRESH_TOKEN_EXPIRE_DAYS: {{ .Values.config.refreshTokenExpireDays | quote }}
  CORS_ORIGINS: "https://{{ .Values.ingress.frontendHost }},http://localhost:3000"
  DATABASE_POOL_SIZE: {{ .Values.backend.env.DATABASE_POOL_SIZE | quote }}
  DATABASE_MAX_OVERFLOW: {{ .Values.backend.env.DATABASE_MAX_OVERFLOW | quote }}
