apiVersion: apps/v1
kind: Deployment
metadata:
  name: rmfood-frontend
  namespace: rmfood
  labels:
    app: rmfood-frontend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: rmfood-frontend
  template:
    metadata:
      labels:
        app: rmfood-frontend
    spec:
      containers:
        - name: frontend
          image: rmfood-frontend:latest
          ports:
            - containerPort: 80
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
