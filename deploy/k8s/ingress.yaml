apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: rmfood-ingress
  namespace: rmfood
  annotations:
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    nginx.ingress.kubernetes.io/proxy-body-size: "50m"
    cert-manager.io/cluster-issuer: "letsencrypt-prod"
spec:
  ingressClassName: nginx
  tls:
    - hosts:
        - rmfood.example.com
      secretName: rmfood-tls
  rules:
    - host: rmfood.example.com
      http:
        paths:
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: rmfood-backend
                port:
                  number: 8000
          - path: /health
            pathType: Exact
            backend:
              service:
                name: rmfood-backend
                port:
                  number: 8000
          - path: /
            pathType: Prefix
            backend:
              service:
                name: rmfood-frontend
                port:
                  number: 80
