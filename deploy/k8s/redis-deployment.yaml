apiVersion: apps/v1
kind: Deployment
metadata:
  name: rmfood-redis
  namespace: rmfood
spec:
  replicas: 1
  selector:
    matchLabels:
      app: rmfood-redis
  template:
    metadata:
      labels:
        app: rmfood-redis
    spec:
      containers:
        - name: redis
          image: redis:7-alpine
          ports:
            - containerPort: 6379
          command: ["redis-server", "--maxmemory", "256mb", "--maxmemory-policy", "allkeys-lru", "--appendonly", "yes"]
          resources:
            requests:
              cpu: "100m"
              memory: "256Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
          livenessProbe:
            exec:
              command: ["redis-cli", "ping"]
            initialDelaySeconds: 5
            periodSeconds: 10
